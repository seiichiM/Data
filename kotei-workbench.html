    pstat("全体工期",md(s.start)+" → "+md(s.finish))+pstat("全体進捗",s.pct+"%")+'</div>':"";
  let table;
  if(!m.rows.length) table='<div class="p-empty">この条件に該当するタスクがありません。抽出範囲を変更してください。</div>';
  else table='<table class="p-gantt"><colgroup>'+m.cols.map(c=>'<col style="width:'+c.w+'mm">').join("")+
    '<col style="width:'+m.chartW+'mm"></colgroup>'+
    '<thead><tr>'+m.cols.map(c=>'<th>'+(c.k==="dur"?(HM()?"時数":"日数"):c.n)+'</th>').join("")+
    '<th class="tl">'+pTimeline(m)+'</th></tr></thead><tbody>'+
    m.rows.map(t=>'<tr'+(t.blank?' class="blankrow"':(t.isSummary?' class="sum"':""))+'>'+
      m.cols.map(c=>'<td class="'+(["dur","start","finish","pct"].indexOf(c.k)>=0?"n":"")+'">'+pCell(t,c)+'</td>').join("")+
      '<td class="trk"><div class="p-track">'+pTrack(t,m)+'</div></td></tr>').join("")+
    '</tbody></table>';
  const legend=PR.legend?'<div class="p-legend">'+
    '<span><i style="background:#3a7fbf"></i>予定</span><span><i style="background:#123f5e"></i>出来高</span>'+
    '<span><i style="background:#d17263"></i>クリティカル</span><span><i style="background:#243444;height:1.2mm"></i>集計</span>'+
    '<span><i style="background:#243444;width:2mm;height:2mm;transform:rotate(45deg)"></i>マイルストーン</span>'+
    (PR.base?'<span><i style="background:#94a3b1;height:1mm"></i>基準計画</span>':"")+
    '<span><i style="background:#eef1f6;border:0.4pt solid #c9d4df"></i>休日</span>'+
    '<span><i style="background:#c0392b;width:1mm"></i>基準日</span>'+
    '<span>破線の端＝この範囲の外へ継続</span></div>':"";
  const foot='<div class="p-foot"><span>'+esc(D.meta.name)+'　'+esc(rg.label)+'</span>'+
    '<span>工程表ワークベンチ　'+ymd(new Date())+'</span></div>';
  let doc='<div class="p-sheet" style="width:'+m.cw+'mm">'+head+stats+table+legend+foot+'</div>';
  if(PR.report) doc+=printReportSheet(m,s);
  return '<div class="pdoc">'+doc+'</div>';
}
const pstat=(k,v,bad)=>'<div class="p-stat"><span class="k">'+k+'</span><span class="v'+(bad?" bad":"")+'">'+v+'</span></div>';
function printReportSheet(m,s){
  const t0=todayD(), data=curveData();
  const late=D.tasks.filter(t=>!t.isSummary&&!t.blank&&(t.pct||0)<100&&LT(t._f,HM()?new Date():t0))
    .map(t=>({t:t,d:workDays(t._f,t0)-1})).sort((a,b)=>b.d-a.d);
  const tops=D.tasks.filter(t=>t.isSummary&&t.level===0);
  return '<div class="p-sheet" style="width:'+m.cw+'mm">'+
   '<div class="p-head"><div><div class="p-title">進捗レポート</div>'+
   '<div class="p-sub">'+esc(D.meta.name)+'</div></div>'+
   '<div class="p-meta">基準日　'+jdate(t0)+'<br>出力　'+jdate(new Date())+'</div></div>'+
   '<div class="p-stats">'+pstat("全体進捗",s.pct+"%")+pstat("工期",s.days+" 稼働"+uName())+
     pstat("残り",Math.max(0,workDays(HM()?nextWork(new Date(),1):t0,s.finish)-1)+" 稼働"+uName())+pstat("遅延",late.length+" 件",late.length>0)+
     pstat("総コスト",yen(s.cost))+'</div>'+
   '<div class="p-h2">出来高曲線（S カーブ）</div>'+
   '<div class="p-chart" style="margin-bottom:4mm">'+sCurveSVG(data)+'</div>'+
   '<div class="p-two"><div><div class="p-h2">大工程の進捗</div>'+
    '<table class="p-gantt"><thead><tr><th>工程</th><th>期間</th><th>進捗</th></tr></thead><tbody>'+
    tops.map(t=>'<tr><td>'+esc(t.wbs)+' '+esc(t.name)+'</td><td class="n">'+md(t._s)+"→"+md(t._f)+'</td><td class="n">'+(t.pct||0)+'%</td></tr>').join("")+
    '</tbody></table></div>'+
   '<div><div class="p-h2">遅延タスク</div>'+
    (late.length?'<table class="p-gantt"><thead><tr><th>タスク</th><th>終了予定</th><th>遅れ</th></tr></thead><tbody>'+
     late.map(x=>'<tr><td>#'+x.t.id+' '+esc(x.t.name)+'</td><td class="n">'+md(x.t._f)+'</td><td class="n">'+x.d+'日</td></tr>').join("")+'</tbody></table>'
     :'<p class="p-note">遅延しているタスクはありません。</p>')+'</div></div>'+
   '<div class="p-foot"><span>'+esc(D.meta.name)+'　進捗レポート</span><span>工程表ワークベンチ　'+ymd(new Date())+'</span></div></div>';
}
function printSheetHTML(){
  const m=printMeta();
  const css=Array.prototype.map.call(document.querySelectorAll("style"),x=>x.textContent).join("\n");
  return '<!doctype html>\n<html lang="ja"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>'+esc(D.meta.name+" "+m.rg.label)+'</title>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">'+
    '<style>'+css+'</style><style>'+
    '@page{size:'+m.pg.w+'mm '+m.pg.h+'mm;margin:10mm}'+
    'html,body{background:#fff!important;height:auto!important;margin:0;padding:8mm;overflow:visible!important}'+
    '#printdoc{display:block!important}'+
    '.printbar{display:flex;gap:12px;align-items:center;margin:0 0 6mm;padding:9px 12px;background:#eef2f7;border:1px solid #b6c3d0;border-radius:5px;font-family:"IBM Plex Sans JP",sans-serif;font-size:13px;color:#16222e}'+
    '.printbar button{font:inherit;padding:6px 16px;border:1px solid #1d4e76;background:#1d4e76;color:#fff;border-radius:4px;cursor:pointer}'+
    '@media print{.printbar{display:none!important}html,body{padding:0}}'+
    '</style></head><body>'+
    '<div class="printbar"><button onclick="window.print()">🖨 印刷する</button>'+
    '<span>'+esc(m.pg.n)+' ／ '+ymd(m.rg.s)+' 〜 '+ymd(m.rg.f)+' ／ '+m.rows.length+' 行　（このバーは印刷されません）</span></div>'+
    '<div id="printdoc">'+buildPrint()+'</div></body></html>';
}
/* --- 印刷ダイアログ --- */
function openPrint(){ renderPrintDlg(); if(!$("#dlgPrint").open)$("#dlgPrint").showModal(); }
function renderPrintDlg(){
  const m=printMeta(), pg=m.pg;
  const cur=PRESETS.filter(p=>p.k===PR.preset)[0]||PRESETS[0];
  const chk=(k,lab)=>'<label style="display:flex;align-items:center;gap:6px;font-size:11.5px"><input type="checkbox" data-pr="'+k+'"'+(PR[k]?" checked":"")+'>'+lab+'</label>';
  $("#dlgPrintBody").innerHTML=
   (PRBLOCK?'<div class="note-blocked">この表示（ブラウザに埋め込まれた画面）では、ブラウザが印刷ダイアログの呼び出しを禁止しているため印刷できません。'+
     '<b>「HTML で保存」</b>で紙面ファイルを保存し、それを開いて印刷してください。'+
     'アプリを .html ファイルとしてダウンロードし、直接開いた場合は「印刷 / PDF 出力」がそのまま使えます。</div>':"")+
   '<div class="pgrid">'+
    '<div class="fset"><h4>抽出する範囲</h4><div class="radio-list">'+
      PRESETS.map(p=>'<label class="'+(p.k===PR.preset?"on":"")+'"><input type="radio" name="prp" data-preset="'+p.k+'"'+(p.k===PR.preset?" checked":"")+'>'+p.n+'<small>'+p.d+'</small></label>').join("")+
      '</div>'+
      (PR.preset==="custom"?'<div class="frow"><label>開始</label><input type="date" data-pr="from" value="'+(PR.from||ymd(m.rg.s))+'"></div>'+
        '<div class="frow"><label>終了</label><input type="date" data-pr="to" value="'+(PR.to||ymd(m.rg.f))+'"></div>':"")+
    '</div>'+
    '<div class="fset"><h4>用紙とスケール</h4>'+
      '<div class="frow"><label>用紙</label><select data-pr="paper">'+Object.keys(PAPER).map(k=>'<option value="'+k+'"'+(k===PR.paper?" selected":"")+'>'+PAPER[k].n+'</option>').join("")+'</select></div>'+
      '<div class="frow"><label>時間目盛</label><select data-pr="scale">'+
        [["auto","自動（"+({day:"日",week:"週",month:"月"}[m.scale])+"）"],["day","日"],["week","週"],["month","月"]]
        .map(o=>'<option value="'+o[0]+'"'+(o[0]===PR.scale?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div>'+
      '<div class="frow"><label>表の列</label><select data-pr="cols">'+
        [["min","簡易（4列）"],["std","標準（6列）"],["full","詳細（8列）"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===PR.cols?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div>'+
      '<p class="hint">1 日あたり '+m.dayMM.toFixed(1)+' mm ／ 表 '+m.leftW+' mm ＋ 工程欄 '+m.chartW.toFixed(0)+' mm</p>'+
    '</div>'+
    '<div class="fset"><h4>紙面に含める</h4>'+
      chk("stats","範囲のサマリー")+chk("shade","休日の網掛け")+chk("label","バー右の担当・進捗")+
      chk("base","基準計画（ベースライン）")+chk("legend","凡例")+chk("report","進捗レポートを別ページで添付")+
      '<p class="hint">依存関係は「先行」列（詳細）で表示します。紙面の矢印は改ページでずれるため描画しません。</p>'+
    '</div>'+
   '</div>'+
   '<div class="pv-wrap" id="pvwrap"><div id="pvinner"><div class="pv-scale" id="pvscale"></div></div></div>';
  $("#pvscale").innerHTML=buildPrint();
  const pxw=(pg.w-20)*96/25.4, avail=$("#pvwrap").clientWidth-24;
  const k=Math.min(1,avail/pxw);
  $("#pvscale").style.width=pxw+"px"; $("#pvscale").style.transform="scale("+k+")";
  $("#pvinner").style.height=($("#pvscale").offsetHeight*k)+"px";
  $("#pageStyle").textContent="@page{size:"+pg.w+"mm "+pg.h+"mm;margin:10mm}";
  $("#prInfo").textContent=pg.n+" ／ "+ymd(m.rg.s)+" 〜 "+ymd(m.rg.f)+" ／ "+m.rows.length+" 行 ／ 推定 "+m.pages+" ページ";
}
$("#dlgPrintBody").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.preset){ PR.preset=t.dataset.preset; renderPrintDlg(); return; }
  const k=t.dataset.pr; if(!k)return;
  PR[k]=t.type==="checkbox"?t.checked:t.value;
  renderPrintDlg();
});
window.addEventListener("beforeprint",()=>{ try{ $("#printdoc").innerHTML=buildPrint(); }catch(e){} });
$("#prGo").addEventListener("click",()=>{
  $("#printdoc").innerHTML=buildPrint();
  const m=printMeta(); $("#pageStyle").textContent="@page{size:"+m.pg.w+"mm "+m.pg.h+"mm;margin:10mm}";
  let fired=false; const h=()=>{ fired=true; };
  window.addEventListener("beforeprint",h);
  try{ window.print(); }catch(e){}
  window.removeEventListener("beforeprint",h);
  if(fired){ PRBLOCK=false; $("#dlgPrint").close(); }
  else { PRBLOCK=true; renderPrintDlg();
    toast("この表示では印刷ダイアログを開けません。「HTML で保存」から出力してください"); }
});
$("#prHtml").addEventListener("click",()=>{
  const m=printMeta();
  const name=((D.meta.name||"project")+"_"+m.rg.label).replace(/[\\/:*?"<>|]/g,"_")+".html";
  saveFile(name,printSheetHTML(),"text/html");
});

/* ============================ 初期化 ============================ */
function seedProgress(){
  schedule();
  D.baseline={}; D.tasks.forEach(t=>{ if(t.blank)return; D.baseline[t.id]={s:ymd(t._s),f:ymd(t._f),p:0}; });
  const g=id=>D.tasks.find(t=>t.id===id);
  g(3).dur=7; g(6).dur=9;
  schedule();
}
(function init(){
  if(!restore()){ D=sampleState(); seedProgress(); }
  const legacy=$("#f-search"); if(legacy)legacy.value=U.query||"";
  render();
  requestAnimationFrame(()=>{ cp.scrollLeft=Math.max(0,X(todayD())-200); });
})();
</script>
