<title>工程表ワークベンチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E9EEF4; --panel:#FFFFFF; --panel2:#F4F7FA; --panel3:#E9F0F7;
  --line:#CBD6E2; --line2:#E2E9F1; --line3:#A9B9CA;
  --ink:#15212C; --ink2:#4C5E70; --ink3:#7A8B9B;
  --accent:#1D4E76; --accent2:#2E7CC4; --accent-soft:#DBE8F5; --accent-ring:#9EC4E8;
  --bar:#3A7FBF; --bar-edge:#255C90; --bar-prog:#16405F; --bar-txt:#FFFFFF;
  --summary:#243444; --milestone:#243444;
  --crit:#C0392B; --crit-bar:#CE5A4A; --crit-edge:#9E2A1D; --crit-soft:#F7E1DD;
  --warn:#A9700F; --warn-soft:#F8EED8; --good:#2C7A55; --good-soft:#DDEFE5;
  --nonwork:#DFE6EE; --holiday:#F1E3E3; --todayline:#C0392B;
  --gridline:#E7EDF4; --weekline:#D3DEEA; --base-bar:#94A3B1;
  --plan:#2E6DA4; --actual:#C9861A;
  --shadow:0 1px 2px rgba(16,33,48,.10), 0 10px 28px rgba(16,33,48,.10);
  --rowh:30px; --headh:48px;
  --font-ui:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  --font-disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-num:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
  --ground:#0C121A;
  --panel:#141D27;
  --panel2:#1A2531;
  --panel3:#202D3A;
  --line:#2A3746;
  --line2:#1E2A36;
  --line3:#3D4D5E;
  --ink:#E6ECF3;
  --ink2:#A6B6C5;
  --ink3:#76889A;
  --accent:#5AA3E0;
  --accent2:#7CBCF0;
  --accent-soft:#173049;
  --accent-ring:#2F6693;
  --bar:#356E9E;
  --bar-edge:#4E93D0;
  --bar-prog:#8FC0E8;
  --bar-txt:#EAF3FB;
  --summary:#9FB3C6;
  --milestone:#B7C7D6;
  --crit:#E0705C;
  --crit-bar:#9C4133;
  --crit-edge:#E0705C;
  --crit-soft:#3A211D;
  --warn:#D8A33C;
  --warn-soft:#33290F;
  --good:#5FB78A;
  --good-soft:#14301F;
  --nonwork:#111B25;
  --holiday:#26191F;
  --todayline:#E0705C;
  --gridline:#1B2632;
  --weekline:#243342;
  --base-bar:#5B6C7D;
  --plan:#4E93D0;
  --actual:#B0802F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}
}
:root[data-theme="dark"]{
  --ground:#0C121A;
  --panel:#141D27;
  --panel2:#1A2531;
  --panel3:#202D3A;
  --line:#2A3746;
  --line2:#1E2A36;
  --line3:#3D4D5E;
  --ink:#E6ECF3;
  --ink2:#A6B6C5;
  --ink3:#76889A;
  --accent:#5AA3E0;
  --accent2:#7CBCF0;
  --accent-soft:#173049;
  --accent-ring:#2F6693;
  --bar:#356E9E;
  --bar-edge:#4E93D0;
  --bar-prog:#8FC0E8;
  --bar-txt:#EAF3FB;
  --summary:#9FB3C6;
  --milestone:#B7C7D6;
  --crit:#E0705C;
  --crit-bar:#9C4133;
  --crit-edge:#E0705C;
  --crit-soft:#3A211D;
  --warn:#D8A33C;
  --warn-soft:#33290F;
  --good:#5FB78A;
  --good-soft:#14301F;
  --nonwork:#111B25;
  --holiday:#26191F;
  --todayline:#E0705C;
  --gridline:#1B2632;
  --weekline:#243342;
  --base-bar:#5B6C7D;
  --plan:#4E93D0;
  --actual:#B0802F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line3);border:3px solid var(--panel2);border-radius:8px}
::-webkit-scrollbar-track{background:var(--panel2)}

#app{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden;min-width:0}
#app>*{min-width:0}

/* ---- title bar ---- */
.titlebar{display:flex;align-items:center;gap:14px;min-width:0;padding:0 12px;height:42px;background:var(--accent);color:#EAF2FA;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;font-family:var(--font-disp);font-weight:700;letter-spacing:.02em}
.brand .mark{width:15px;height:15px;border:2px solid #EAF2FA;border-radius:2px;position:relative;transform:translateY(2px)}
.brand .mark::after{content:"";position:absolute;left:1px;top:3px;width:9px;height:3px;background:#EAF2FA}
.brand small{font-family:var(--font-num);font-weight:400;font-size:10px;opacity:.7;letter-spacing:.08em}
.pjname{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.pjname input{background:transparent;border:1px solid transparent;color:#fff;padding:3px 7px;border-radius:3px;width:100%;max-width:420px;font-weight:500}
.pjname input:hover{border-color:rgba(255,255,255,.28)}
.pjname input:focus{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.5);outline:none}
.qat{display:flex;gap:3px;flex:none}
.qat button{background:transparent;border:1px solid transparent;color:#DCE9F5;border-radius:3px;padding:4px 8px;cursor:pointer;font-size:11.5px}
.qat button:hover:not(:disabled){background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.qat button:disabled{opacity:.34;cursor:default}

/* ---- ribbon ---- */
.ribbon-tabs{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--line);padding:0 8px}
.ribbon-tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:7px 15px 6px;cursor:pointer;color:var(--ink2);font-weight:500}
.ribbon-tabs button:hover{color:var(--ink);background:var(--panel3)}
.ribbon-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
.ribbon{display:none;gap:0;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 8px 4px;overflow-x:auto}
.ribbon.on{display:flex}
.rgroup{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 10px;border-right:1px solid var(--line2)}
.rgroup:last-child{border-right:none}
.rrow{display:flex;gap:3px;align-items:stretch}
.rgroup .glabel{font-size:9.5px;color:var(--ink3);letter-spacing:.06em;font-family:var(--font-num)}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:46px;padding:4px 6px;background:transparent;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--ink);font-size:10.5px;white-space:nowrap}
.rb .ic{font-size:15px;line-height:1;font-family:var(--font-num);color:var(--accent);font-weight:500}
.rb:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent-ring)}
.rb:disabled{opacity:.35;cursor:default}
.rb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-ring)}
.rb.wide{flex-direction:row;min-width:0;gap:5px;font-size:11.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel2)}
.seg button{background:transparent;border:none;border-right:1px solid var(--line);padding:5px 10px;cursor:pointer;color:var(--ink2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.field{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.field input,.field select{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-family:var(--font-num);font-size:11px}

/* ---- workspace ---- */
.workspace{display:grid;grid-template-columns:auto 1fr auto;min-height:0;background:var(--ground)}
.viewrail{display:flex;flex-direction:column;gap:2px;padding:8px 5px;background:var(--panel2);border-right:1px solid var(--line);width:78px}
.viewrail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--ink2);font-size:10px;line-height:1.25;text-align:center}
.viewrail button .ic{font-size:17px;color:var(--accent);font-family:var(--font-num)}
.viewrail button:hover{background:var(--panel3)}
.viewrail button[aria-current="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.stage{min-width:0;min-height:0;position:relative;overflow:hidden;background:var(--panel)}
.view{position:absolute;inset:0;display:none;min-height:0}
.view.on{display:grid}

/* ---- gantt view ---- */
#v-gantt{grid-template-columns:var(--gw,640px) 6px 1fr}
.pane{min-width:0;min-height:0;overflow:auto;position:relative;background:var(--panel)}
.splitter{background:var(--panel2);border-left:1px solid var(--line);border-right:1px solid var(--line);cursor:col-resize;position:relative}
.splitter::after{content:"";position:absolute;top:50%;left:1px;width:2px;height:34px;margin-top:-17px;background:var(--line3);border-radius:2px}

table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px;width:max-content;min-width:100%}
table.grid th{position:sticky;top:0;z-index:3;height:var(--headh);background:var(--panel3);color:var(--ink2);font-weight:600;font-size:11px;text-align:left;padding:0 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line3);white-space:nowrap;user-select:none}
table.grid td{height:var(--rowh);padding:0 7px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel)}
table.grid td.num,table.grid th.num{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:11px}
table.grid td.ctr{text-align:center}
table.grid td[data-col="mode"]{cursor:pointer;user-select:none}
table.grid td.date{font-family:var(--font-num);font-size:11px;color:var(--ink2)}
tr.trow:hover td{background:var(--panel2)}
tr.trow.sel td{background:var(--accent-soft)}
tr.trow.summary td{font-weight:600;background:var(--panel2)}
tr.trow.summary.sel td{background:var(--accent-soft)}
tr.trow.blank td{background:var(--panel2)}
tr.trow.blank.sel td{background:var(--accent-soft)}
.blanktxt{color:var(--ink3);font-size:11.5px}
.row-hit.blank{background:var(--panel2)}
.row-hit.blank.sel{background:var(--accent-soft)}
tr.trow.crit td.c-id{color:var(--crit);box-shadow:inset 3px 0 0 var(--crit)}
tr.trow.done td.c-name{color:var(--ink3)}
td.c-id{color:var(--ink3);font-family:var(--font-num);font-size:10.5px;text-align:right;background:var(--panel2)!important}
td.c-wbs{font-family:var(--font-num);font-size:10.5px;color:var(--ink3)}
.nm{display:flex;align-items:center;gap:4px;min-width:0}
.tw{width:14px;height:14px;flex:none;border:none;background:none;cursor:pointer;color:var(--ink2);font-size:9px;line-height:1;padding:0}
.tw.ph{visibility:hidden}
.nm .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:0 5px;border-radius:9px;font-size:9.5px;line-height:15px;font-family:var(--font-num);background:var(--panel3);color:var(--ink2);border:1px solid var(--line)}
.chip.ms{background:var(--panel3);color:var(--ink)}
.chip.cr{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.chip.wn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pbar{position:relative;height:11px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);overflow:hidden;min-width:44px}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2);display:block}
.pbar b{position:absolute;inset:0;text-align:center;font-size:9px;font-family:var(--font-num);font-weight:500;color:var(--ink);line-height:9px;mix-blend-mode:normal}
.cell-edit{width:100%;height:calc(var(--rowh) - 6px);border:1px solid var(--accent2);border-radius:2px;background:var(--panel);padding:0 4px;font-size:12px;font-family:var(--font-ui)}
.cell-edit.num{font-family:var(--font-num);text-align:right}
.edit-wrap{display:flex;align-items:stretch;gap:2px;height:calc(var(--rowh) - 6px)}
.edit-wrap .cell-edit{flex:1;min-width:0;height:100%}
.edit-wrap input[type=number]{-moz-appearance:textfield}
.edit-wrap input[type=number]::-webkit-outer-spin-button,.edit-wrap input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.edit-wrap.hidenative input[type=date]::-webkit-calendar-picker-indicator{opacity:0;width:0;padding:0;margin:0}
.spin{display:flex;flex-direction:column;width:15px;flex:none}
.spin button{flex:1;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;font-size:7px;line-height:1}
.spin button:first-child{border-radius:2px 2px 0 0;border-bottom:none}
.spin button:last-child{border-radius:0 0 2px 2px}
.spin button:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-ring)}
.calbtn{width:20px;flex:none;border:1px solid var(--line);border-radius:2px;background:var(--panel2);color:var(--ink2);cursor:pointer;font-size:11px;line-height:1;padding:0}
.calbtn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-ring)}

/* ---- chart ---- */
.chart-inner{position:relative;width:max-content;min-width:100%}
.tl{position:sticky;top:0;z-index:3;height:var(--headh);background:var(--panel3);border-bottom:1px solid var(--line3)}
.tl-major,.tl-minor{position:relative;height:24px}
.tl-major{border-bottom:1px solid var(--line)}
.tl-cell{position:absolute;top:0;bottom:0;border-right:1px solid var(--line);font-size:10.5px;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);overflow:hidden;white-space:nowrap}
.tl-major .tl-cell{font-weight:500;color:var(--ink);justify-content:flex-start;padding-left:6px}
.tl-cell.we{color:var(--ink3);background:var(--nonwork)}
.tl-cell.hd{color:var(--crit);background:var(--holiday)}
.tl-cell.td{background:var(--accent-soft);color:var(--accent);font-weight:500}
.chart-body{position:relative;overflow:hidden}
.bg-nonwork{position:absolute;top:0;bottom:0;background:var(--nonwork);opacity:.75}
.bg-holiday{position:absolute;top:0;bottom:0;background:var(--holiday);opacity:.85}
.bg-vline{position:absolute;top:0;bottom:0;width:1px;background:var(--weekline)}
.bg-hline{position:absolute;left:0;right:0;height:1px;background:var(--gridline)}
.row-hit{position:absolute;left:0;right:0}
.row-hit:hover{background:var(--panel2)}
.row-hit.sel{background:var(--accent-soft)}
.todayline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--todayline);z-index:4;pointer-events:none}
.todayflag{position:absolute;top:2px;transform:translateX(-50%);font-size:9px;font-family:var(--font-num);color:#fff;background:var(--todayline);padding:0 4px;border-radius:2px;z-index:5;pointer-events:none;white-space:nowrap}

.bar{position:absolute;border-radius:3px;cursor:grab;z-index:2}
.bar.task{background:var(--bar);border:1px solid var(--bar-edge);box-shadow:0 1px 1px rgba(16,33,48,.18)}
.bar.task.crit{background:var(--crit-bar);border-color:var(--crit-edge)}
.bar.task .prog{position:absolute;left:0;top:0;bottom:0;background:var(--bar-prog);border-radius:2px 0 0 2px;opacity:.9}
.bar.task.sel{outline:2px solid var(--accent);outline-offset:1px}
.bar.sum{background:var(--summary);height:9px!important;border-radius:1px}
.bar.sum::before,.bar.sum::after{content:"";position:absolute;top:100%;border-style:solid;border-color:var(--summary) transparent transparent transparent;border-width:6px 5px 0 0}
.bar.sum::before{left:0}
.bar.sum::after{right:0;border-width:6px 0 0 5px;border-color:var(--summary) transparent transparent transparent}
.bar.sum .sprog{position:absolute;left:0;top:2px;bottom:2px;background:var(--panel);opacity:.55}
.ms-mark{position:absolute;width:13px;height:13px;background:var(--milestone);transform:rotate(45deg);z-index:2;cursor:grab;border-radius:2px}
.ms-mark.crit{background:var(--crit)}
.ms-mark.sel{outline:2px solid var(--accent);outline-offset:2px}
.bar-label{position:absolute;font-size:10.5px;color:var(--ink2);white-space:nowrap;pointer-events:none;z-index:2;font-family:var(--font-num)}
.bar-label.in{color:var(--bar-txt);font-family:var(--font-ui)}
.base-bar{position:absolute;height:5px;background:var(--base-bar);border-radius:1px;opacity:.85;z-index:1}
.slack-line{position:absolute;height:0;border-top:1px dashed var(--ink3);z-index:1}
.slack-line::after{content:"";position:absolute;right:0;top:-3px;width:1px;height:7px;background:var(--ink3)}
.grip{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:3}
.grip.l{left:-3px}
.grip.r{right:-3px}
.link-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1.5px solid var(--accent);top:50%;margin-top:-4.5px;z-index:5;cursor:crosshair;opacity:0;transition:opacity .12s}
.link-dot.l{left:-13px}
.link-dot.r{right:-13px}
.barwrap:hover .link-dot{opacity:1}
.prog-grip{position:absolute;width:8px;height:8px;top:50%;margin-top:-4px;background:var(--panel);border:1.5px solid var(--bar-prog);border-radius:2px;z-index:4;cursor:ew-resize;opacity:0}
.barwrap:hover .prog-grip{opacity:1}
svg.links{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
svg.links path{fill:none;stroke:var(--ink3);stroke-width:1.2}
svg.links path.crit{stroke:var(--crit);stroke-width:1.4}
.drag-ghost{position:absolute;border:1.5px dashed var(--accent);background:rgba(46,124,196,.14);border-radius:3px;z-index:9;pointer-events:none}
.link-rubber{position:absolute;height:0;border-top:1.5px dashed var(--accent);z-index:9;pointer-events:none;transform-origin:0 0}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:200;background:var(--panel);color:var(--ink);border:1px solid var(--line3);border-radius:5px;box-shadow:var(--shadow);padding:8px 10px;font-size:11.5px;max-width:290px;pointer-events:none;display:none}
#tip h5{margin:0 0 5px;font-size:12px;font-family:var(--font-disp);font-weight:700}
#tip dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
#tip dt{color:var(--ink3);font-size:10.5px}
#tip dd{margin:0;font-family:var(--font-num);font-size:10.5px}

/* ---- inspector ---- */
.inspector{width:312px;background:var(--panel2);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.inspector.hidden{display:none}
.insp-head{position:sticky;top:0;background:var(--panel2);border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.insp-head h3{margin:0;font-family:var(--font-disp);font-size:13px;font-weight:700;letter-spacing:.02em}
.insp-body{padding:10px 12px 22px;display:flex;flex-direction:column;gap:12px}
.fset{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.fset h4{margin:0;font-size:10px;letter-spacing:.1em;color:var(--ink3);font-family:var(--font-num);font-weight:500;text-transform:uppercase}
.frow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center}
.frow>label{font-size:11px;color:var(--ink2)}
.frow input,.frow select,.frow textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-size:11.5px}
.frow input[type=date],.frow input[type=number]{font-family:var(--font-num)}
.frow textarea{resize:vertical;min-height:52px;font-size:11.5px}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--ink2);padding:2px 6px;font-size:12px}
.icon-btn:hover{background:var(--panel3);border-color:var(--line)}
.mini{width:100%;border-collapse:collapse;font-size:11px}

/* ============================ 状態 ============================ */
const LS="kotei-workbench.v1";
const IN_FRAME=(function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
let PRBLOCK=false, confirmArm=0;
let D=sampleState();
let U={view:"gantt",zoom:"day",dayW:28,sel:[],showCritical:true,showBaseline:false,showSlack:false,showLabel:true,
       filter:"all",query:"",gw:520,collapsed:{},inspector:true,loadRes:"all",tab:"task"};
let undoStack=[],redoStack=[],suspend=false;

function snap(){return JSON.stringify(D);}
function pushUndo(){ if(suspend)return; undoStack.push(snap()); if(undoStack.length>80)undoStack.shift(); redoStack.length=0; }
function doUndo(){ if(!undoStack.length)return; redoStack.push(snap()); D=JSON.parse(undoStack.pop()); U.sel=U.sel.filter(id=>D.tasks.some(t=>t.id===id)); render(); toast("元に戻しました"); }
function doRedo(){ if(!redoStack.length)return; undoStack.push(snap()); D=JSON.parse(redoStack.pop()); render(); toast("やり直しました"); }
function normalizeDoc(){
  D.meta=D.meta||{}; if(D.meta.unit!=="hour")D.meta.unit="day";
  D.cal=D.cal||{}; if(!D.cal.hours||typeof D.cal.hours.start!=="number")D.cal.hours={start:9,end:17};
  if(!(D.cal.hours.end>D.cal.hours.start))D.cal.hours={start:9,end:17};
}
function persist(){ try{localStorage.setItem(LS,JSON.stringify({D:D,U:{zoom:U.zoom,dayW:U.dayW,view:U.view,gw:U.gw,showCritical:U.showCritical,showBaseline:U.showBaseline,showSlack:U.showSlack,showLabel:U.showLabel,collapsed:U.collapsed,inspector:U.inspector}}));}catch(e){} }
function restore(){ try{const s=JSON.parse(localStorage.getItem(LS)||"null"); if(s&&s.D&&Array.isArray(s.D.tasks)&&s.D.tasks.length){D=s.D; Object.assign(U,s.U||{});
      if(!(U.dayW>0))U.dayW=ZOOMW[U.zoom]||28; U.dayW=clamp(U.dayW,ZMIN,ZMAX); normalizeDoc(); return true;} }catch(e){} return false; }

/* ============================ カレンダー ============================ */
function isHoli(d){ return !D.cal.ignore && !!D.cal.holidays[ymd(d)]; }
function isWork(d,free){ if(free||D.cal.ignore)return true; return !!D.cal.work[d.getDay()] && !D.cal.holidays[ymd(d)]; }
function freeOf(t){ return !!t && t.mode==="cont"; }
/* --- 単位（日 / 時間）--- */
const HM=()=>D.meta.unit==="hour";
const HS=()=>{ const h=D.cal.hours; return h&&h.start!=null?h.start:9; };
const HE=()=>{ const h=D.cal.hours; return h&&h.end!=null?h.end:17; };
const HPD=()=>Math.max(1,HE()-HS());
const atH=(d,h)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),h);
const d0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const ymdhm=d=>ymd(d)+" "+hhmm(d);
const pdt=s=>{ if(s instanceof Date)return new Date(s);
  const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/);
  return m?new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0):pd(s); };
const uEnd=d=>HM()?new Date(d.getTime()+3600000):d;          /* 終了の表示は 1 単位後 */
const uName=()=>HM()?"時間":"日";
/* --- 日単位の実装 --- */
function nextWorkD(d,dir,free){ if(free||D.cal.ignore)return d0(d);
  dir=dir||1; let x=d0(d),g=0; while(!isWork(x)&&g<2000){x=addD(x,dir);g++;} return x; }
function shiftWorkD(d,n,free){ if(free||D.cal.ignore)return addD(d0(d),n);
  let x=nextWorkD(d,n<0?-1:1); const dir=n<0?-1:1; let k=Math.abs(n),g=0;
  while(k>0&&g<20000){ x=addD(x,dir); if(isWork(x))k--; g++; } return x; }
/* --- 時間単位の実装（所定時間内のみを稼働時間として数える）--- */
function isWorkI(x,free){ return isWork(x,free)&&x.getHours()>=HS()&&x.getHours()<HE(); }
function nextWorkI(x,dir,free){
  dir=dir||1; let d=new Date(x.getFullYear(),x.getMonth(),x.getDate(),x.getHours()),g=0;
  while(g++<3000){
    if(!isWork(d,free)){ d=dir>0?atH(addD(d,1),HS()):atH(addD(d,-1),HE()-1); continue; }
    const h=d.getHours();
    if(h<HS()){ d=dir>0?atH(d,HS()):atH(addD(d,-1),HE()-1); continue; }
    if(h>=HE()){ d=dir>0?atH(addD(d,1),HS()):atH(d,HE()-1); continue; }
    return d; }
  return d;
}
function shiftWorkI(x,n,free){
  const dir=n<0?-1:1; let d=nextWorkI(x,dir,free), k=Math.abs(n|0), per=HPD();
  const whole=Math.floor(k/per);
  if(whole){ const dd=shiftWorkD(d0(d),whole*dir,free); d=atH(dd,d.getHours()); k-=whole*per; }
  let g=0; while(k>0&&g++<20000){ d=nextWorkI(new Date(d.getTime()+dir*3600000),dir,free); k--; }
  return d;
}
function workHours(a,b,free){
  if(a.getTime()>b.getTime())return 0;
  let d=nextWorkI(a,1,free), n=0, g=0;
  while(d.getTime()<=b.getTime()&&g++<40000){ n++; d=nextWorkI(new Date(d.getTime()+3600000),1,free); }
  return n;
}
function nextWork(d,dir,free){ return HM()?nextWorkI(d,dir,free):nextWorkD(d,dir,free); }
function shiftWork(d,n,free){ return HM()?shiftWorkI(d,n,free):shiftWorkD(d,n,free); }
function endFrom(s,dur,free){ return dur<=1?nextWork(s,1,free):shiftWork(s,dur-1,free); }
function startFrom(f,dur,free){ return dur<=1?nextWork(f,-1,free):shiftWork(f,-(dur-1),free); }
function workDays(a,b,free){ if(HM())return workHours(a,b,free);
  if(dayDiff(a,b)<0)return 0; if(free||D.cal.ignore)return dayDiff(a,b)+1;
  let n=0,x=new Date(a),g=0;
  while(dayDiff(x,b)>=0&&g<20000){ if(isWork(x))n++; x=addD(x,1); g++; } return n; }

/* ============================ スケジューリング（CPM） ============================ */
let SCH={ps:null,pf:null,cyclic:false,byId:new Map()};
function descendants(i){ const t=D.tasks[i],out=[];
  for(let j=i+1;j<D.tasks.length;j++){ const k=D.tasks[j]; if(!k.blank&&k.level<=t.level)break; out.push(k); }
  while(out.length&&out[out.length-1].blank)out.pop();
  return out; }
function parentOf(i){ for(let j=i-1;j>=0;j--) if(D.tasks[j].level<D.tasks[i].level) return D.tasks[j]; return null; }

function schedule(){
  const T=D.tasks, byId=new Map(T.map(t=>[t.id,t])); SCH.byId=byId;
  T.forEach((t,i)=>{
    if(t.blank){ t.isSummary=false; t.wbs=""; t.warn=""; t.critical=false; t.slack=0; t.cost=0; return; }
    let nx=null; for(let j=i+1;j<T.length;j++){ if(!T[j].blank){ nx=T[j]; break; } }
    t.isSummary=!!(nx&&nx.level>t.level);
    if(t.isSummary)t.ms=false;
    if(t.ms)t.dur=0; t.warn=""; });
  let ctr=[];
  T.forEach(t=>{ if(t.blank)return; ctr=ctr.slice(0,t.level+1); ctr[t.level]=(ctr[t.level]||0)+1; t.wbs=ctr.map(n=>n||1).join("."); });
  const leaves=T.filter(t=>!t.isSummary&&!t.blank);
  leaves.forEach(t=>{ t.preds=(t.preds||[]).filter(p=>byId.has(p.id)&&p.id!==t.id&&!byId.get(p.id).isSummary&&!byId.get(p.id).blank); });
  T.filter(t=>t.isSummary||t.blank).forEach(t=>{t.preds=[];});
  const indeg=new Map(),succ=new Map();
  leaves.forEach(t=>{indeg.set(t.id,0);succ.set(t.id,[]);});
  leaves.forEach(t=>t.preds.forEach(p=>{ if(indeg.has(p.id)){ indeg.set(t.id,indeg.get(t.id)+1); succ.get(p.id).push({id:t.id,type:p.type,lag:p.lag||0}); } }));
  const q=leaves.filter(t=>indeg.get(t.id)===0).map(t=>t.id),order=[];
  while(q.length){ const id=q.shift(); order.push(id);
    succ.get(id).forEach(s=>{ indeg.set(s.id,indeg.get(s.id)-1); if(indeg.get(s.id)===0)q.push(s.id); }); }
  SCH.cyclic=order.length!==leaves.length;
  if(SCH.cyclic){ leaves.forEach(t=>{ if(order.indexOf(t.id)<0){ order.push(t.id); t.warn="循環参照"; } }); }

  const PS=nextWork(pdt(D.meta.start)); SCH.ps=PS;
  order.forEach(id=>{
    const t=byId.get(id), dur=Math.max(t.ms?0:1,t.dur|0), fr=freeOf(t);
    let st=PS;
    t.preds.forEach(p=>{ const q2=byId.get(p.id); if(!q2||!q2._s)return; const lag=p.lag||0; let c;
      if(p.type==="SS") c=shiftWork(q2._s,lag,fr);
      else if(p.type==="FF") c=startFrom(shiftWork(q2._f,lag,fr),dur||1,fr);
      else if(p.type==="SF") c=startFrom(shiftWork(q2._s,lag,fr),dur||1,fr);
      else c=shiftWork(q2._f,1+lag,fr);
      if(LT(st,c)) st=c; });
    if(t.mode==="manual"&&t.start) st=nextWork(pdt(t.start),1,fr);
    const c=t.constraint||{type:"ASAP",date:null};
    if(c.date){ const cd=nextWork(pdt(c.date),1,fr);
      if(c.type==="MSO") st=cd;
      else if(c.type==="SNET"){ if(LT(st,cd)) st=cd; }
      else if(c.type==="SNLT"){ if(LT(cd,st)){ st=cd; t.warn="制約と競合"; } }
      else if(c.type==="MFO") st=startFrom(nextWork(pdt(c.date),-1,fr),dur||1,fr);
      else if(c.type==="FNLT"){ const lim=startFrom(nextWork(pdt(c.date),-1,fr),dur||1,fr); if(LT(lim,st)){ st=lim; t.warn="制約と競合"; } }
    }
    t._s=nextWork(st,1,fr); t._f=(dur<=0)?t._s:endFrom(t._s,dur,fr);
  });
  let PF=PS; leaves.forEach(t=>{ if(t._f&&LT(PF,t._f))PF=t._f; }); SCH.pf=PF;
  for(let i=order.length-1;i>=0;i--){
    const t=byId.get(order[i]), dur=Math.max(t.ms?0:1,t.dur|0), fr=freeOf(t); let lf=PF;
    succ.get(t.id).forEach(s=>{ const u=byId.get(s.id); if(!u||!u._ls)return; const lag=s.lag||0; let c;
      if(s.type==="SS") c=endFrom(shiftWork(u._ls,-lag,fr),dur||1,fr);
      else if(s.type==="FF") c=shiftWork(u._lf,-lag,fr);
      else if(s.type==="SF") c=endFrom(shiftWork(u._lf,-lag,fr),dur||1,fr);
      else c=shiftWork(u._ls,-1-lag,fr);
      if(LT(c,lf)) lf=c; });
    t._lf=lf; t._ls=(dur<=0)?lf:startFrom(lf,dur,fr);
    t.slack=LE(t._f,t._lf)?workDays(t._f,t._lf,fr)-1:-(workDays(t._lf,t._f,fr)-1);
    t.critical=t.slack<=0;
  }
  for(let i=T.length-1;i>=0;i--){
    const t=T[i]; if(!t.isSummary)continue;
    const kids=descendants(i).filter(k=>!k.isSummary&&!k.blank);
    if(!kids.length){ t._s=PS; t._f=PS; t.dur=0; t.slack=0; t.critical=false; continue; }
    let s=kids[0]._s,f=kids[0]._f,slk=Infinity,w=0,wp=0;
    kids.forEach(k=>{ if(LT(k._s,s))s=k._s; if(LT(f,k._f))f=k._f;
      slk=Math.min(slk,k.slack); const d=Math.max(1,k.dur|0)||1; w+=d; wp+=d*(k.pct||0); });
    t._s=s; t._f=f; t.dur=workDays(s,f); t.slack=slk; t.critical=slk<=0; t.pct=w?Math.round(wp/w):0;
  }
  T.forEach(t=>{ if(t.blank){ t.start=null; t.finish=null; t.cost=0; return; }
    t.start=HM()?ymdhm(t._s):ymd(t._s); t.finish=HM()?ymdhm(uEnd(t._f)):ymd(t._f); t.cost=taskCost(t); });
  D.tasks.forEach((t,i)=>{ if(t.isSummary) t.cost=descendants(i).filter(k=>!k.isSummary&&!k.blank).reduce((a,k)=>a+k.cost,0); });
}
function resById(id){ return D.resources.find(r=>r.id===id); }
function taskCost(t){ if(t.isSummary||t.blank)return 0; const dur=Math.max(t.ms?0:1,t.dur|0);
  return (t.res||[]).reduce((a,x)=>{ const r=resById(x.id); return a+(r?r.rate*(x.units/100)*dur:0); },0); }

/* リソース日別負荷 */
function loadMap(){
  const m=new Map();
  D.tasks.forEach(t=>{ if(t.isSummary||t.ms||t.blank)return; const fr=freeOf(t);
    (t.res||[]).forEach(x=>{ if(!m.has(x.id))m.set(x.id,{});
      const o=m.get(x.id); let d=new Date(t._s),g=0;
      while(dayDiff(d,t._f)>=0&&g<2000){
        if(isWork(d,fr)){ const k=ymd(d);
          let share=1;
          if(HM()){ const ds=atH(d,HS()).getTime(), de=atH(d,HE()).getTime();
            const a=Math.max(ds,t._s.getTime()), b2=Math.min(de,t._f.getTime()+3600000);
            share=Math.max(0,(b2-a)/3600000)/HPD(); }
          if(share>0) o[k]=(o[k]||0)+(x.units||100)*share; }
        d=addD(d,1); g++; } });
  });
  return m;
}
function overAlloc(){
  const m=loadMap(),out=[];
  m.forEach((o,rid)=>{ const r=resById(rid); if(!r)return; const days=Object.keys(o).filter(k=>o[k]>r.max);
    if(days.length) out.push({id:rid,name:r.name,days:days.sort(),peak:Math.max.apply(null,Object.keys(o).map(k=>o[k]))}); });
  return out;
}

const ROWH=30, HEADH=48;
const ZOOMW={day:28,week:11,month:3.6,quarter:1.25};
const ZMIN=0.35, ZMAX=90;
function zscale(w){ return w>=12?"day":(w>=4?"week":(w>=1.5?"month":"quarter")); }
function zpos(w){ return Math.round(1000*(Math.log(w)-Math.log(ZMIN))/(Math.log(ZMAX)-Math.log(ZMIN))); }
function zfrom(pos){ return Math.exp(Math.log(ZMIN)+(pos/1000)*(Math.log(ZMAX)-Math.log(ZMIN))); }
function setZoom(nw,anchorX){
  nw=clamp(nw,ZMIN,ZMAX); const old=U.dayW||28; if(Math.abs(nw-old)<1e-6)return;
  const r=cp.getBoundingClientRect();
  const ax=(anchorX==null)?cp.clientWidth/2:clamp(anchorX-r.left,0,cp.clientWidth);
  const dayIdx=(cp.scrollLeft+ax)/old;
  U.dayW=nw; render();
  cp.scrollLeft=Math.max(0,dayIdx*nw-ax);
}
function zoomStep(f,anchorX){ setZoom((U.dayW||28)*f,anchorX); }
function zoomFit(){
  const avail=Math.max(120,cp.clientWidth-18);
  setZoom(avail/Math.max(1,HM()?((AXI&&AXI.n)||1):RANGE.days));
  cp.scrollLeft=0;
}
const MODEN={auto:"自動（稼働カレンダー）",cont:"連続（土日祝も稼働）",manual:"手動"};
const CTYPE={ASAP:"できるだけ早く",SNET:"開始日以降",SNLT:"開始日以前",MSO:"開始日固定",MFO:"終了日固定",FNLT:"終了日以前"};

function matchTask(t){
  if(t.blank)return false;
  const q=U.query.trim().toLowerCase(); let ok=true;
  if(U.filter==="crit") ok=!t.isSummary&&t.critical;
  else if(U.filter==="inc") ok=!t.isSummary&&(t.pct||0)<100;
  else if(U.filter==="late") ok=!t.isSummary&&(t.pct||0)<100&&LT(t._f,HM()?new Date():todayD());
  else if(U.filter==="ms") ok=!!t.ms;
  else if(U.filter==="over"){ const s=new Set(overAlloc().map(o=>o.id)); ok=(t.res||[]).some(x=>s.has(x.id)); }
  if(ok&&q){ const rn=(t.res||[]).map(x=>(resById(x.id)||{}).name||"").join(" ");
    ok=(t.name+" "+rn+" "+(t.notes||"")).toLowerCase().indexOf(q)>=0; }
  return ok;
}
function isFiltering(){ return U.filter!=="all"||!!U.query.trim(); }
function visibleTasks(){
  if(isFiltering()){
    const keep=new Set();
    D.tasks.forEach((t,i)=>{ if(t.isSummary||!matchTask(t))return; keep.add(t.id);
      let lv=t.level; for(let j=i-1;j>=0;j--){ if(D.tasks[j].level<lv){ keep.add(D.tasks[j].id); lv=D.tasks[j].level; if(!lv)break; } } });
    return D.tasks.filter(t=>keep.has(t.id));
  }
  const out=[]; let hide=null;
  for(const t of D.tasks){ if(hide!==null){ if(t.level>hide) continue; hide=null; }
    out.push(t); if(t.isSummary&&U.collapsed[t.id]) hide=t.level; }
  return out;
}
/* ============================ 文字列変換 ============================ */
function predsText(t){ return (t.preds||[]).map(p=>{ const lag=p.lag||0;
  return p.id+(p.type&&p.type!=="FS"?p.type:"")+(lag?(lag>0?"+":"")+lag+"日":""); }).join(", "); }
function parsePreds(s){ const out=[];
  String(s).split(/[,、]/).forEach(tok=>{ const m=tok.trim().match(/^(\d+)\s*(FS|SS|FF|SF)?\s*([+-]?\s*\d+)?/i);
    if(m&&m[1]) out.push({id:+m[1],type:(m[2]||"FS").toUpperCase(),lag:m[3]?parseInt(m[3].replace(/\s/g,""),10):0}); });
  return out; }
function resText(t){ return (t.res||[]).map(x=>{ const r=resById(x.id); if(!r)return"";
  return r.name+(x.units!==100?"["+x.units+"%]":""); }).filter(Boolean).join(", "); }
function parseRes(s){ const out=[];
  String(s).split(/[,、]/).forEach(tok=>{ tok=tok.trim(); if(!tok)return;
    const m=tok.match(/^(.*?)(?:\[(\d+)%?\])?$/); const nm=(m[1]||"").trim(); if(!nm)return;
    let r=D.resources.find(x=>x.name===nm||x.init===nm);
    if(!r){ r={id:uid("r"),name:nm,init:nm.slice(0,3),group:"未分類",max:100,rate:0}; D.resources.push(r); }
    out.push({id:r.id,units:m[2]?+m[2]:100}); });
  return out; }
function durText(t){ return t.ms?("0 "+uName()):(t.dur|0)+" "+uName(); }

function cellHTML(t,c){
  if(t.blank) return c.k!=="name"?"":
    '<div class="nm" style="padding-left:'+(t.level*15)+'px"><span class="tw ph"></span>'+
    '<span class="txt blanktxt">'+(t.name?esc(t.name):"（空白行）")+'</span></div>';
  switch(c.k){
    case "id": return t.id;
    case "wbs": return esc(t.wbs||"");
    case "mode": return t.isSummary?"":
      (t.mode==="manual"?'<span title="手動スケジュール（もう一度クリックで切替）">✋</span>':
       t.mode==="cont"?'<span title="連続スケジュール：土日祝も稼働（もう一度クリックで切替）" style="color:var(--warn);font-weight:600">∞</span>':
       '<span title="自動スケジュール：稼働カレンダーに従う（もう一度クリックで切替）" style="color:var(--ink3)">⚙</span>');
    case "name":{
      const tw=t.isSummary?'<button class="tw" data-tw="'+t.id+'" aria-label="折りたたみ">'+(U.collapsed[t.id]?"▶":"▼")+'</button>':'<span class="tw ph"></span>';
      const badge=t.warn?'<span class="chip wn" title="'+esc(t.warn)+'">!</span>':(t.ms?'<span class="chip ms">◆</span>':"");
      return '<div class="nm" style="padding-left:'+(t.level*15)+'px">'+tw+'<span class="txt">'+esc(t.name)+'</span>'+badge+'</div>';
    }
    case "dur": return durText(t);
    case "start": return HM()?(md(t._s)+" "+hhmm(t._s)):(md(t._s)+"("+WD[t._s.getDay()]+")");
    case "finish": return HM()?(md(uEnd(t._f))+" "+hhmm(uEnd(t._f))):(md(t._f)+"("+WD[t._f.getDay()]+")");
    case "preds": return esc(predsText(t));
    case "res": return esc(resText(t));
    case "pct": return '<div class="pbar"><i style="width:'+(t.pct||0)+'%"></i><b>'+(t.pct||0)+'%</b></div>';
    case "cost": return yen(t.cost);
    case "slack": return t.isSummary?"":(t.slack>0?t.slack+"日":(t.slack<0?'<span style="color:var(--crit)">'+t.slack+"日</span>":"0"));
  }
  return "";
}
function renderGrid(rows){
  $("#gridcols").innerHTML=COLS.map(c=>'<col style="width:'+(HM()&&(c.k==="start"||c.k==="finish")?c.w+20:c.w)+'px">').join("");
  $("#gridhead").innerHTML='<tr>'+COLS.map(c=>'<th class="'+(c.cls.indexOf("num")>=0?"num":"")+'">'+c.t+'</th>').join("")+'</tr>';

  $("#gridbody").innerHTML=rows.map(t=>{
    const cls=["trow"]; if(t.blank)cls.push("blank"); if(t.isSummary)cls.push("summary"); if(sel.has(t.id))cls.push("sel");
    if(U.showCritical&&t.critical&&!t.isSummary)cls.push("crit"); if((t.pct||0)>=100)cls.push("done");
    return '<tr class="'+cls.join(" ")+'" data-tid="'+t.id+'">'+COLS.map(c=>
      '<td class="'+c.cls+'" data-col="'+c.k+'"'+((c.edit&&(!t.blank||c.k==="name"))?' data-edit="1"':"")+'>'+cellHTML(t,c)+'</td>').join("")+'</tr>';
  }).join("");
}

let RANGE={s:null,f:null,days:0};
function chartRange(){
  let s=SCH.ps,f=SCH.pf;
  D.tasks.forEach(t=>{ if(t._s&&LT(t._s,s))s=t._s; if(t._f&&LT(f,t._f))f=t._f; });
  if(D.baseline) Object.keys(D.baseline).forEach(k=>{ const b=D.baseline[k];
    if(LT(pdt(b.s),s))s=pdt(b.s); if(LT(f,pdt(b.f)))f=pdt(b.f); });
  const t0=todayD(); if(dayDiff(t0,s)>0)s=t0; if(dayDiff(f,t0)>0)f=t0;
  if(HM()){ s=d0(s); f=addD(d0(f),1); return {s:s,f:f,days:dayDiff(s,f)+1}; }
  s=new Date(s.getFullYear(),s.getMonth(),1);
  f=addD(new Date(f.getFullYear(),f.getMonth()+1,0),10);
  return {s:s,f:f,days:dayDiff(s,f)+1};
}
let AXI=null;
const axKey=d=>ymd(d)+"#"+d.getHours();
function buildAxis(){
  if(!HM()){ AXI=null; return; }
  const m=new Map(), slots=[]; let i=0,g=0;
  let d=nextWorkI(atH(RANGE.s,HS()),1); const end=atH(RANGE.f,HE()-1).getTime();
  while(d.getTime()<=end&&g++<60000){ m.set(axKey(d),i++); slots.push(d); d=nextWorkI(new Date(d.getTime()+3600000),1); }
  AXI={idx:m,slots:slots,n:i};
}
function axPos(d){
  if(!AXI)return 0;
  let k=axKey(d);
  if(AXI.idx.has(k))return AXI.idx.get(k);
  const sn=nextWorkI(d,1); k=axKey(sn);
  if(AXI.idx.has(k))return AXI.idx.get(k);
  return d.getTime()<RANGE.s.getTime()?0:AXI.n;
}
const X=d=>HM()?axPos(d)*U.dayW:dayDiff(RANGE.s,d)*U.dayW;
function timelineHTML(){
  const w=U.dayW;
  if(HM()){
    if(!AXI||!AXI.n)return '<div class="tl"><div class="tl-major"></div><div class="tl-minor"></div></div>';
    const t0=ymd(todayD()); let maj="",min="",st=0;
    const key=d=>ymd(d);
    for(let i=1;i<=AXI.slots.length;i++){
      if(i===AXI.slots.length||key(AXI.slots[i])!==key(AXI.slots[st])){

        maj+='<div class="tl-cell'+(ymd(d)===t0?" td":"")+'" style="left:'+(st*w)+'px;width:'+wd+'px">'+
          (wd>=54?(md(d)+"("+WD[d.getDay()]+")"):(wd>=26?md(d):""))+'</div>';
        st=i; } }
    min=AXI.slots.map((d,i)=>'<div class="tl-cell" style="left:'+(i*w)+'px;width:'+w+'px" title="'+jdate(d)+" "+hhmm(d)+'">'+
      (w>=17?d.getHours():(w>=11?String(d.getHours()).slice(-1):""))+'</div>').join("");
    return '<div class="tl"><div class="tl-major">'+maj+'</div><div class="tl-minor">'+min+'</div></div>';

  const grp=(keyFn,labFn,cls)=>{ let out="",st=0;

        const x=st*w,wd=(i-st)*w;
        out+='<div class="tl-cell '+(cls?cls(days[st],i-st):"")+'" style="left:'+x+'px;width:'+wd+'px">'+labFn(days[st],i-st)+'</div>';
        st=i; } }
    return out; };
  if(z==="day"){
    major=grp(d=>d.getFullYear()+"-"+d.getMonth(),d=>d.getFullYear()+"年"+(d.getMonth()+1)+"月");
    minor=days.map((d,i)=>{ const k=ymd(d); const c=k===t0?"td":(isHoli(d)?"hd":(isWork(d)?"":"we"));
      const lab=w>=19?(d.getDate()+'<br>'+WD[d.getDay()]):(w>=10?String(d.getDate()):"");
      return '<div class="tl-cell '+c+'" style="left:'+(i*w)+'px;width:'+w+'px" title="'+jdate(d)+(isHoli(d)?" "+esc(D.cal.holidays[k]):"")+'">'+lab+'</div>'; }).join("");
  } else if(z==="week"){
    major=grp(d=>d.getFullYear()+"-"+d.getMonth(),d=>d.getFullYear()+"年"+(d.getMonth()+1)+"月");
    minor=grp(d=>{const x=addD(d,-((d.getDay()+6)%7));return ymd(x);},(d,n)=>n*w>28?md(addD(d,-((d.getDay()+6)%7))):"");
  } else if(z==="month"){
    major=grp(d=>d.getFullYear(),d=>d.getFullYear()+"年");
    minor=grp(d=>d.getFullYear()+"-"+d.getMonth(),(d,n)=>n*w>22?(d.getMonth()+1)+"月":"");
  } else {
    major=grp(d=>d.getFullYear(),d=>d.getFullYear()+"年");
    minor=grp(d=>d.getFullYear()+"-"+Math.floor(d.getMonth()/3),(d,n)=>n*w>26?"Q"+(Math.floor(d.getMonth()/3)+1):"");
  }
  return '<div class="tl"><div class="tl-major">'+major+'</div><div class="tl-minor">'+minor+'</div></div>';
}

  let bg="",bars="",lab="";

      bg+='<div class="bg-vline" style="left:'+(i*w)+'px"></div>'; });
  } else {
  if(w>=8){ for(let i=0;i<RANGE.days;i++){ const d=addD(RANGE.s,i),k=ymd(d);
      if(isHoli(d)) bg+='<div class="bg-holiday" style="left:'+(i*w)+'px;width:'+w+'px"></div>';
      else if(!isWork(d)) bg+='<div class="bg-nonwork" style="left:'+(i*w)+'px;width:'+w+'px"></div>'; } }
  for(let i=0;i<RANGE.days;i++){ const d=addD(RANGE.s,i);
    const line=(sc==="day"&&d.getDay()===1)||(sc!=="day"&&d.getDate()===1);
    if(line) bg+='<div class="bg-vline" style="left:'+(i*w)+'px"></div>'; }
  }
  rows.forEach((t,i)=>{ bg+='<div class="bg-hline" style="top:'+((i+1)*ROWH-1)+'px"></div>'; });
  const rects=new Map();
  rows.forEach((t,i)=>{
    const y=i*ROWH;
    if(t.blank){ bars+='<div class="row-hit blank'+(sel.has(t.id)?" sel":"")+'" data-row="'+t.id+'" style="top:'+y+'px;height:'+ROWH+'px"></div>'; return; }
    const x1=X(t._s), x2=X(t._f)+w, crit=U.showCritical&&t.critical;
    bars+='<div class="row-hit'+(sel.has(t.id)?" sel":"")+'" data-row="'+t.id+'" style="top:'+y+'px;height:'+ROWH+'px"></div>';
    if(D.baseline&&U.showBaseline&&D.baseline[t.id]){ const b=D.baseline[t.id];
      bars+='<div class="base-bar" style="left:'+X(pdt(b.s))+'px;width:'+Math.max(3,X(pdt(b.f))+w-X(pdt(b.s)))+'px;top:'+(y+22)+'px" title="ベースライン '+b.s+" 〜 "+b.f+'"></div>'; }
    if(t.ms&&!t.isSummary){
      rects.set(t.id,{x1:x1+w/2-7,x2:x1+w/2+7,ym:y+ROWH/2,y:y});
      bars+='<div class="ms-mark barwrap'+(crit?" crit":"")+(sel.has(t.id)?" sel":"")+'" data-tid="'+t.id+'" data-bar="ms" style="left:'+(x1+w/2-6.5)+'px;top:'+(y+8)+'px">'+
        '<span class="link-dot l" data-dot="l"></span><span class="link-dot r" data-dot="r"></span></div>';
      if(U.showLabel) lab+='<div class="bar-label" style="left:'+(x1+w/2+11)+'px;top:'+(y+8)+'px">'+esc(t.name)+" "+md(t._s)+'</div>';
    } else if(t.isSummary){
      rects.set(t.id,{x1:x1,x2:x2,ym:y+13,y:y});
      bars+='<div class="bar sum" data-tid="'+t.id+'" data-bar="sum" style="left:'+x1+'px;width:'+Math.max(6,x2-x1)+'px;top:'+(y+9)+'px">'+
        '<span class="sprog" style="left:'+(t.pct||0)+'%;right:0"></span></div>';
      if(U.showLabel) lab+='<div class="bar-label" style="left:'+(x2+8)+'px;top:'+(y+8)+'px">'+(t.pct||0)+'%</div>';
    } else {
      const bw=Math.max(3,x2-x1);
      rects.set(t.id,{x1:x1,x2:x2,ym:y+15,y:y});
      bars+='<div class="bar task barwrap'+(crit?" crit":"")+(sel.has(t.id)?" sel":"")+'" data-tid="'+t.id+'" data-bar="task" style="left:'+x1+'px;width:'+bw+'px;top:'+(y+8)+'px;height:15px">'+
        '<span class="prog" style="width:'+(t.pct||0)+'%"></span>'+
        '<span class="grip l" data-grip="l"></span><span class="grip r" data-grip="r"></span>'+
        (bw>26?'<span class="prog-grip" data-grip="p" style="left:calc('+(t.pct||0)+'% - 4px);margin-left:'+((t.pct||0)<3?6:0)+'px" title="ドラッグで進捗を更新"></span>':"")+
        '<span class="link-dot l" data-dot="l"></span><span class="link-dot r" data-dot="r"></span></div>';
      if(U.showSlack&&t.slack>0&&t._lf){ const sx=x2,ex=X(t._lf)+w;
        if(ex>sx) bars+='<div class="slack-line" style="left:'+sx+'px;width:'+(ex-sx)+'px;top:'+(y+15)+'px"></div>'; }
      if(U.showLabel){ const rn=resText(t); const txt=(rn?rn:"")+(t.pct?"  "+t.pct+"%":"");
        if(txt) lab+='<div class="bar-label" style="left:'+(x2+7)+'px;top:'+(y+9)+'px">'+esc(txt)+'</div>'; }
    }
  });
  /* 依存関係の矢印 */
  let paths="";
  rows.forEach(t=>{ (t.preds||[]).forEach(p=>{ const a=rects.get(p.id),b=rects.get(t.id); if(!a||!b)return;
    const pt=SCH.byId.get(p.id), crit=U.showCritical&&t.critical&&pt&&pt.critical;
    const c=crit?' class="crit"':"", g=9;
    let d="",ah="";
    if(p.type==="SS"){ const ex=b.x1-6; d="M"+a.x1+","+a.ym+"h-"+g+"V"+b.ym+"H"+ex; ah=arrowR(ex,b.ym); }
    else if(p.type==="FF"){ const ex=b.x2+6; d="M"+a.x2+","+a.ym+"h"+g+"V"+b.ym+"H"+ex; ah=arrowL(ex,b.ym); }
    else if(p.type==="SF"){ const ex=b.x2+6; d="M"+a.x1+","+a.ym+"h-"+g+"V"+b.ym+"H"+ex; ah=arrowL(ex,b.ym); }
    else { const ex=b.x1-6;
      if(ex>a.x2+g) d="M"+a.x2+","+a.ym+"H"+(a.x2+g)+"V"+b.ym+"H"+ex;
      else { const my=(b.ym>a.ym)?(b.y-5):(b.y+ROWH+5);
        d="M"+a.x2+","+a.ym+"h"+g+"V"+my+"H"+(ex-g)+"V"+b.ym+"H"+ex; }
      ah=arrowR(ex,b.ym); }
    paths+='<path'+c+' d="'+d+'"></path><path'+c+' d="'+ah+'" style="fill:'+(crit?"var(--crit)":"var(--ink3)")+';stroke:none"></path>';
  }); });
  const svg='<svg class="links" width="'+W+'" height="'+H+'">'+paths+'</svg>';
  const tx=HM()?X(nextWorkI(new Date(),1)):X(todayD());
  const today=(tx>=0&&tx<=W)?'<div class="todayline" style="left:'+tx+'px"></div><div class="todayflag" style="left:'+tx+'px">今日 '+md(todayD())+'</div>':"";
  return timelineHTML()+'<div class="chart-body" id="chartBody" style="width:'+W+'px;height:'+H+'px">'+bg+bars+svg+lab+today+'</div>';
}
const arrowR=(x,y)=>"M"+x+","+y+"l-5,-3.2 l0,6.4 z";
const arrowL=(x,y)=>"M"+x+","+y+"l5,-3.2 l0,6.4 z";

/* ============================ ステータスバー ============================ */
function projStats(){
  const leaves=D.tasks.filter(t=>!t.isSummary&&!t.blank);
  const w=leaves.reduce((a,t)=>a+Math.max(1,t.dur|0),0);
  const wp=leaves.reduce((a,t)=>a+Math.max(1,t.dur|0)*(t.pct||0),0);
  const t0=todayD();
  return {
    start:SCH.ps,finish:SCH.pf,days:workDays(SCH.ps,SCH.pf),
    pct:w?Math.round(wp/w):0,
    cost:leaves.reduce((a,t)=>a+(t.cost||0),0),
    crit:leaves.filter(t=>t.critical).length,
    late:leaves.filter(t=>(t.pct||0)<100&&LT(t._f,HM()?new Date():t0)).length,
    ms:leaves.filter(t=>t.ms).length,
    over:overAlloc().length,total:leaves.length
  };
}

function loadAxis(days,cw,W){
  let ticks="";
  days.forEach((d,i)=>{ if(i===0||days[i-1].getMonth()!==d.getMonth())

/* ============================ ネットワーク図 ============================ */
function renderNet(){
  const leaves=D.tasks.filter(t=>!t.isSummary&&!t.blank), byId=SCH.byId;
  const dep=new Map(), seen=new Set();
  const depthOf=t=>{ if(dep.has(t.id))return dep.get(t.id); if(seen.has(t.id))return 0; seen.add(t.id);
    const v=(t.preds||[]).reduce((a,p)=>{ const q=byId.get(p.id); return q&&!q.isSummary?Math.max(a,depthOf(q)+1):a; },0);
    dep.set(t.id,v); return v; };
  leaves.forEach(depthOf);
  const cols={}; leaves.forEach(t=>{ const d=dep.get(t.id)||0; (cols[d]=cols[d]||[]).push(t); });
  const NW=160,NH=64,GX=56,GY=14, keys=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const pos=new Map(); let maxRows=0;
  keys.forEach(k=>{ cols[k].forEach((t,i)=>{ pos.set(t.id,{x:k*(NW+GX),y:i*(NH+GY)}); }); maxRows=Math.max(maxRows,cols[k].length); });
  const W=keys.length*(NW+GX), H=maxRows*(NH+GY)+8;
  const sel=new Set(U.sel);
  const nodes=leaves.map(t=>{ const p=pos.get(t.id);
    return '<div class="node'+(U.showCritical&&t.critical?" crit":"")+(t.ms?" ms":"")+(sel.has(t.id)?" sel":"")+'" data-tid="'+t.id+'" style="left:'+p.x+'px;top:'+p.y+'px;height:'+NH+'px">'+
      '<div class="nid"><span>#'+t.id+' / '+esc(t.wbs)+'</span><span>'+(t.ms?"◆":(t.dur|0)+"日")+'</span></div>'+
      '<div class="nnm" title="'+esc(t.name)+'">'+esc(t.name)+'</div>'+
      '<div class="ndt"><span>'+md(t._s)+' → '+md(t._f)+'</span><span>'+(t.pct||0)+'%</span></div>'+
      '<div class="ndt"><span style="color:'+(t.critical?"var(--crit)":"var(--ink3)")+'">'+(t.critical?"クリティカル":"余裕 "+t.slack+"日")+'</span></div></div>'; }).join("");
  let paths="";
  leaves.forEach(t=>{ (t.preds||[]).forEach(p=>{ const a=pos.get(p.id),b=pos.get(t.id); if(!a||!b)return;
    const q=byId.get(p.id), crit=U.showCritical&&t.critical&&q&&q.critical;
    const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,mx=(x1+x2)/2;
    paths+='<path'+(crit?' class="crit"':"")+' d="M'+x1+','+y1+'C'+mx+','+y1+' '+mx+','+y2+' '+(x2-7)+','+y2+'"></path>'+
      '<path'+(crit?' class="crit"':"")+' d="'+arrowR(x2-1,y2)+'" style="stroke:none;fill:'+(crit?"var(--crit)":"var(--ink3)")+'"></path>'; }); });
  $("#netInner").innerHTML=
  '<div class="vhead"><div><h2>ネットワーク図（PERT）</h2><p>先行タスクからの最長経路で列を決めた依存関係図です。赤枠がクリティカルパス上のタスク、二重枠がマイルストーン。ボックスをクリックすると選択され、タスク情報に反映されます。</p></div></div>'+
  '<div class="netbox"><div class="net-inner" style="width:'+W+'px;height:'+H+'px">'+
  '<svg class="netlinks" width="'+W+'" height="'+H+'">'+paths+'</svg>'+nodes+'</div></div>';
}

function curveData(){
  const days=workDayList(SCH.ps,SCH.pf), leaves=D.tasks.filter(t=>!t.isSummary&&!t.ms&&!t.blank);
  const total=leaves.reduce((a,t)=>a+Math.max(1,t.dur|0),0)||1, t0=todayD();
  const info=leaves.map(t=>{ const dur=Math.max(1,t.dur|0);
    const endNow=LE(t._f,HM()?new Date():t0)?t._f:(HM()?new Date():t0);
    const elapsedNow=LE(t._s,endNow)?workDays(t._s,endNow):0;
    return {t:t,dur:dur,earned:dur*(t.pct||0)/100,en:elapsedNow}; });
  return days.map(d=>{ let p=0,a=0;
    info.forEach(x=>{ const t=x.t;
      const dEnd=HM()?atH(d,HE()-1):d;
      const end=LE(t._f,dEnd)?t._f:dEnd;
      const el=LE(t._s,end)?workDays(t._s,end):0;
      p+=Math.min(x.dur,el);
      a+=x.en>0?x.earned*Math.min(1,el/x.en):(el>0?x.earned:0); });
    return {d:d,p:p/total*100,a:dayDiff(d,t0)>=0?a/total*100:null}; });
}

function parseDateInput(s){
  s=String(s).trim().replace(/[／]/g,"/"); if(!s)return null;
  let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})[T ](\d{1,2}):(\d{2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);
  m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/); if(m)return new Date(+m[1],+m[2]-1,+m[3],HM()?HS():0);
  m=s.match(/^(\d{1,2})[-/](\d{1,2})$/); if(m)return new Date(SCH.ps.getFullYear(),+m[1]-1,+m[2]);
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());

function wouldCycle(predId,succId){
  const g=new Map(D.tasks.map(t=>[t.id,(t.preds||[]).map(p=>p.id)]));
  const stack=[predId],seen=new Set();
  while(stack.length){ const c=stack.pop(); if(c===succId)return true; if(seen.has(c))continue; seen.add(c);
    (g.get(c)||[]).forEach(p=>stack.push(p)); }
  return false;
}
function addLink(predId,succId,type,lag){
  if(predId===succId)return toast("同じタスクは接続できません");
  const s=SCH.byId.get(succId),p=SCH.byId.get(predId);
  if(!s||!p||s.isSummary||p.isSummary||s.blank||p.blank)return toast("集計タスク・空白行は接続できません");
  if((s.preds||[]).some(x=>x.id===predId))return toast("すでに接続されています");
  if(wouldCycle(predId,succId))return toast("循環参照になるため接続できません");
  mutate(()=>{ s.preds=(s.preds||[]).concat([{id:predId,type:type||"FS",lag:lag||0}]); });
  toast("#"+predId+" → #"+succId+" を "+(type||"FS")+" で接続しました");
}

function deleteSel(){
  const ids=new Set(); selTasks().forEach(t=>{ const i=idx(t.id); ids.add(t.id); if(t.isSummary)descendants(i).forEach(k=>ids.add(k.id)); });
  if(!ids.size)return;
  mutate(()=>{ D.tasks=D.tasks.filter(t=>!ids.has(t.id));
    D.tasks.forEach(t=>{ t.preds=(t.preds||[]).filter(p=>!ids.has(p.id)); });
    if(D.baseline) ids.forEach(id=>{ delete D.baseline[id]; });
    U.sel=[]; });
  toast(ids.size+" 件を削除しました");
}
function indentSel(dir){
  mutate(()=>{ selTasks().forEach(t=>{ const i=idx(t.id); if(i<=0&&dir>0)return;
    const prev=D.tasks[i-1];
    if(dir>0){ if(!prev||t.level>prev.level)return; t.level=Math.min(t.level+1,prev.level+1); }
    else { if(t.level===0)return; t.level--; }
    const kids=descendants(i); kids.forEach(k=>{ k.level=Math.max(0,k.level+dir); }); }); });
}
function moveSel(dir){
  const t=selTasks()[0]; if(!t)return;
  const i=idx(t.id), n=1+descendants(i).length;
  if(dir<0){
    if(i===0)return;
    let j=i-1; while(j>0&&D.tasks[j].level>t.level)j--;
    mutate(()=>{ const cut=D.tasks.splice(i,n); D.tasks.splice(j,0,...cut); });
  }else{
    const after=i+n; if(after>=D.tasks.length)return;
    const nb=1+descendants(after).length;
    mutate(()=>{ const cut=D.tasks.splice(i,n); D.tasks.splice(i+nb,0,...cut); });
  }
}
function setMode(v){
  const list=selTasks().filter(t=>!t.isSummary&&!t.blank);
  if(!list.length)return toast("タスクを選択してください");
  mutate(()=>{ list.forEach(t=>{ t.mode=v; }); });
  toast(list.length+" 件を「"+MODEN[v]+"」にしました");
}
function cycleMode(id){
  const t=SCH.byId.get(id); if(!t||t.blank)return;
  if(t.isSummary)return toast("集計タスクは子タスクから自動計算されます");
  const order=["auto","cont","manual"], nx=order[(order.indexOf(t.mode||"auto")+1)%3];
  mutate(()=>{ t.mode=nx; });
  toast("#"+t.id+" を「"+MODEN[nx]+"」にしました");
}
function setPct(v){ mutate(()=>{ selTasks().forEach(t=>{ if(!t.isSummary&&!t.blank)t.pct=clamp(v|0,0,100); }); }); }
function linkSel(){
  const s=selTasks().filter(t=>!t.isSummary&&!t.blank); if(s.length<2)return toast("2つ以上のタスクを選択してください");
  const order=s.slice().sort((a,b)=>idx(a.id)-idx(b.id));
  pushUndo();
  for(let i=1;i<order.length;i++){ const a=order[i-1],b=order[i];
    if(!(b.preds||[]).some(p=>p.id===a.id)&&!wouldCycle(a.id,b.id)) b.preds=(b.preds||[]).concat([{id:a.id,type:"FS",lag:0}]); }
  render(); toast("選択したタスクを FS で接続しました");
}
function unlinkSel(){ const ids=new Set(U.sel);
  mutate(()=>{ selTasks().forEach(t=>{ t.preds=[]; });
    D.tasks.forEach(t=>{ t.preds=(t.preds||[]).filter(p=>!ids.has(p.id)); }); });
  toast("依存関係を解除しました"); }

let editing=null;
const HAS_PICKER=(function(){ try{ return typeof HTMLInputElement.prototype.showPicker==="function"; }catch(e){ return false; } })();
function rawValue(t,col){
  switch(col){ case "name":return t.name; case "dur":return String(t.dur|0); case "start":return HM()?String(t.start||"").replace(" ","T"):t.start;
    case "preds":return predsText(t); case "res":return resText(t); case "pct":return String(t.pct||0); }
  return "";
}
function startEdit(td){
  if(!td||editing)return;
  const tr=td.closest("tr"), t=SCH.byId.get(+tr.dataset.tid), col=td.dataset.col;
  if(!t||!td.dataset.edit)return;
  if(t.blank&&col!=="name")return;
  if(t.isSummary&&["dur","start","pct","preds"].indexOf(col)>=0)return toast("集計タスクは子タスクから自動計算されます");
  const html=td.innerHTML, isNum=["dur","pct"].indexOf(col)>=0, val=esc(rawValue(t,col));
  if(col==="dur"){
    td.innerHTML='<div class="edit-wrap"><input class="cell-edit num" type="number" min="0" step="1" value="'+val+'">'+
      '<span class="spin"><button type="button" tabindex="-1" data-spin="1" title="1 日増やす" aria-label="1 日増やす">▲</button>'+
      '<button type="button" tabindex="-1" data-spin="-1" title="1 日減らす" aria-label="1 日減らす">▼</button></span></div>';
  } else if(col==="start"){
    td.innerHTML='<div class="edit-wrap'+(HAS_PICKER?" hidenative":"")+'"><input class="cell-edit" type="'+(HM()?"datetime-local":"date")+'" value="'+val+'">'+
      (HAS_PICKER?'<button type="button" tabindex="-1" class="calbtn" data-cal="1" title="カレンダーから選ぶ" aria-label="カレンダーから選ぶ">▦</button>':"")+'</div>';
  } else {
    td.innerHTML='<input class="cell-edit'+(isNum?" num":"")+'" value="'+val+'">';
  }
  const inp=td.querySelector("input"); editing={td:td,html:html,id:t.id,col:col};
  inp.focus(); try{ if(col!=="start"&&inp.select)inp.select(); }catch(e){}
  Array.prototype.forEach.call(td.querySelectorAll("[data-spin]"),b=>{
    b.addEventListener("mousedown",e=>{ e.preventDefault();
      inp.value=Math.max(0,(parseInt(inp.value,10)||0)+(+b.dataset.spin)); inp.focus(); });
  });
  const calb=td.querySelector("[data-cal]");
  if(calb) calb.addEventListener("mousedown",e=>{ e.preventDefault(); inp.focus(); try{ inp.showPicker(); }catch(err){} });
  if(col==="start") inp.addEventListener("change",()=>{ if(editing&&editing.td===td&&inp.value) commitEdit(inp.value); });
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); commitEdit(inp.value); }
    else if(e.key==="Escape"){ e.preventDefault(); cancelEdit(); }
    else if(e.key==="Tab"){ e.preventDefault(); const cols=COLS.filter(c=>c.edit).map(c=>c.k);
      const ni=cols.indexOf(col)+(e.shiftKey?-1:1), nc=cols[(ni+cols.length)%cols.length];
      commitEdit(inp.value); const ntd=document.querySelector('tr[data-tid="'+t.id+'"] td[data-col="'+nc+'"]'); if(ntd)startEdit(ntd); }
  });
  inp.addEventListener("blur",()=>{ if(editing&&editing.td===td) commitEdit(inp.value); });
}
function cancelEdit(){ if(!editing)return; const e=editing; editing=null; e.td.innerHTML=e.html; }
function commitEdit(val){
  if(!editing)return; const {id,col}=editing; editing=null;
  const t=SCH.byId.get(id); if(!t)return render();
  if(String(val)===String(rawValue(t,col))){ render(); return; }
  pushUndo();
  if(col==="name") t.name=String(val).trim()||t.name;
  else if(col==="dur"){ const n=Math.max(0,parseInt(String(val).replace(/[^\d-]/g,""),10)||0);
    if(n===0){ t.ms=true; t.dur=0; } else { t.ms=false; t.dur=n; } }
  else if(col==="start"){ const d=parseDateInput(val); if(d) setStartByDrag(t,nextWork(d,1,freeOf(t))); }
  else if(col==="preds"){ const ps=parsePreds(val).filter(p=>p.id!==t.id&&D.tasks.some(x=>x.id===p.id&&!x.isSummary&&!x.blank)&&!wouldCycle(p.id,t.id)); t.preds=ps; }
  else if(col==="res") t.res=parseRes(val);
  else if(col==="pct") t.pct=clamp(parseInt(val,10)||0,0,100);
  render();
}

function selectRow(id,e){
  const list=ROWS.map(t=>t.id);
  if(e&&(e.ctrlKey||e.metaKey)){ const i=U.sel.indexOf(id); if(i>=0)U.sel.splice(i,1); else U.sel.push(id); }
  else if(e&&e.shiftKey&&U.sel.length){ const a=list.indexOf(U.sel[U.sel.length-1]),b=list.indexOf(id);
    if(a>=0&&b>=0){ const s=Math.min(a,b),t=Math.max(a,b); U.sel=list.slice(s,t+1); } else U.sel=[id]; }
  else U.sel=[id];
}

function chartBodyRect(){ const el=$("#chartBody"); return el?el.getBoundingClientRect():null; }

  const dot=e.target.closest(".link-dot"), bar=e.target.closest("[data-bar]"), row=e.target.closest(".row-hit");
  if(dot&&bar){ e.preventDefault(); startLink(bar,dot.dataset.dot,e); return; }

function startBar(el,grip,e){
  const t=SCH.byId.get(+el.dataset.tid); if(!t||t.isSummary)return;
  drag={kind:grip==="p"?"pct":(grip?"resize"+grip:"move"),t:t,el:el,x0:e.clientX,
        left:parseFloat(el.style.left),width:el.offsetWidth,dd:0,pct:t.pct||0,
        s0:new Date(t._s),f0:new Date(t._f),d0:Math.max(1,t.dur|0)};
  document.body.style.cursor=drag.kind==="move"?"grabbing":"ew-resize";
}
function startLink(el,side,e){
  const r=chartBodyRect(),br=el.getBoundingClientRect();
  const ox=(side==="r"?br.right:br.left)-r.left, oy=br.top+br.height/2-r.top;
  const rb=document.createElement("div"); rb.className="link-rubber"; rb.style.left=ox+"px"; rb.style.top=oy+"px";
  $("#chartBody").appendChild(rb);
  drag={kind:"link",t:SCH.byId.get(+el.dataset.tid),side:side,ox:ox,oy:oy,rb:rb};
}
document.addEventListener("mousemove",e=>{
  if(!drag)return;
  const w=U.dayW;
  if(drag.kind==="link"){ const r=chartBodyRect(); if(!r)return;
    const dx=e.clientX-r.left-drag.ox, dy=e.clientY-r.top-drag.oy;
    drag.rb.style.width=Math.sqrt(dx*dx+dy*dy)+"px";
    drag.rb.style.transform="rotate("+Math.atan2(dy,dx)+"rad)"; return; }
  const dd=Math.round((e.clientX-drag.x0)/w); drag.dd=dd;
  if(drag.kind==="move"){ drag.el.style.left=(drag.left+dd*w)+"px"; }
  else if(drag.kind==="resizer"){ drag.el.style.width=Math.max(w*0.6,drag.width+dd*w)+"px"; }
  else if(drag.kind==="resizel"){ drag.el.style.left=(drag.left+dd*w)+"px"; drag.el.style.width=Math.max(w*0.6,drag.width-dd*w)+"px"; }
  else if(drag.kind==="pct"){ const br=drag.el.getBoundingClientRect();
    const p=clamp(Math.round((e.clientX-br.left)/br.width*100/5)*5,0,100); drag.pct=p;
    const pe=drag.el.querySelector(".prog"); if(pe)pe.style.width=p+"%";
    const pg=drag.el.querySelector(".prog-grip"); if(pg)pg.style.left="calc("+p+"% - 4px)"; }
});
document.addEventListener("mouseup",e=>{
  if(!drag)return; const d=drag; drag=null; document.body.style.cursor="";
  if(d.kind==="link"){ d.rb.remove();
    const el=document.elementFromPoint(e.clientX,e.clientY), tgt=el&&el.closest?el.closest("[data-bar],[data-row]"):null;
    if(tgt){ const tid=+(tgt.dataset.tid||tgt.dataset.row);
      if(tid&&tid!==d.t.id){ if(d.side==="r")addLink(d.t.id,tid,"FS",0); else addLink(tid,d.t.id,"FS",0); } }
    return; }
  if(!d.dd&&d.kind!=="pct"){ render(); return; }
  const t=d.t, fr=freeOf(t);
  if(d.kind==="move"&&d.dd){ mutate(()=>{ setStartByDrag(t,HM()?shiftWork(d.s0,d.dd,fr):nextWork(addD(d.s0,d.dd),1,fr)); }); toast("#"+t.id+" を移動しました（制約：開始日以降）"); }
  else if(d.kind==="resizer"&&d.dd){ mutate(()=>{ const nf=HM()?shiftWork(d.f0,d.dd,fr):nextWork(addD(d.f0,d.dd),-1,fr);
      const nd=Math.max(1,workDays(t._s,nf,fr)); if(t.ms&&nd>0)t.ms=false; t.dur=nd; }); }
  else if(d.kind==="resizel"&&d.dd){ mutate(()=>{ const ns=HM()?shiftWork(d.s0,d.dd,fr):nextWork(addD(d.s0,d.dd),1,fr);
      const nd=Math.max(1,workDays(ns,d.f0,fr)); t.dur=nd; setStartByDrag(t,ns); }); }
  else if(d.kind==="pct"){ if(d.pct!==(t.pct||0)) mutate(()=>{ t.pct=d.pct; }); else render(); }
});

$("#inspector").addEventListener("change",e=>{
  const t=U.sel.length?SCH.byId.get(U.sel[U.sel.length-1]):null; if(!t)return;
  const f=e.target.dataset.f, p=e.target.dataset.p, r=e.target.dataset.r, i=+e.target.dataset.i;
  if(f){ pushUndo(); const v=e.target.value;
    if(f==="name")t.name=v; else if(f==="mode")t.mode=v;
    else if(f==="ms"){ t.ms=v==="1"; if(t.ms)t.dur=0; else if(!t.dur)t.dur=1; }
    else if(f==="dur"){ const n=Math.max(0,parseInt(v,10)||0); t.dur=n; t.ms=n===0; }
    else if(f==="pct")t.pct=clamp(parseInt(v,10)||0,0,100);
    else if(f==="start"){ const d=parseDateInput(v); if(d)setStartByDrag(t,nextWork(d)); }
    else if(f==="ctype"){ t.constraint=t.constraint||{}; t.constraint.type=v; if(v==="ASAP")t.constraint.date=null;
      else if(!t.constraint.date)t.constraint.date=t.start; }
    else if(f==="cdate"){ t.constraint=t.constraint||{type:"SNET"}; t.constraint.date=v||null; if(v&&t.constraint.type==="ASAP")t.constraint.type="SNET"; }
    else if(f==="notes")t.notes=v;
    render(); return; }
  if(p){ pushUndo(); if(p==="id")t.preds[i].id=+e.target.value; else if(p==="type")t.preds[i].type=e.target.value;
    else if(p==="lag")t.preds[i].lag=parseInt(e.target.value,10)||0;
    t.preds=t.preds.filter(x=>!wouldCycle2(x.id,t.id,t)); render(); return; }
  if(r){ pushUndo(); if(r==="id")t.res[i].id=e.target.value; else if(r==="units")t.res[i].units=clamp(parseInt(e.target.value,10)||0,0,400); render(); }
});
function wouldCycle2(pid,sid,t){ const save=t.preds; t.preds=save.filter(x=>x.id!==pid); const c=wouldCycle(pid,sid); t.preds=save; return c; }

    ["link","選択をリンク",""],["unlink","リンク解除",""],["setMS","マイルストーンに変更",""],null,
    ["info","タスク情報",""],["delTask","削除","Del"]]
    .map(m=>m?'<button data-act="'+m[0]+'">'+m[1]+'<kbd>'+m[2]+'</kbd></button>':"<hr>").join("");
  ctx.style.left="0px"; ctx.style.top="0px"; ctx.style.maxHeight="";
  ctx.classList.add("on");
  const vw=window.innerWidth, vh=window.innerHeight, M=6;
  let r=ctx.getBoundingClientRect();
  if(r.height>vh-M*2){ ctx.style.maxHeight=(vh-M*2)+"px"; r=ctx.getBoundingClientRect(); }
  let left=x, top=y;
  if(left+r.width>vw-M) left=Math.max(M,x-r.width);          /* 右端 → 左に開く */
  if(top+r.height>vh-M) top=Math.max(M,y-r.height);          /* 下端 → 上に開く */
  if(top<M) top=M;
  if(left<M) left=M;
  ctx.style.left=left+"px"; ctx.style.top=top+"px";
}

/* 保存：アーティファクト内では downloads 機能、単体の HTML では通常のダウンロード */
let DLNS;
async function saveFile(filename,data,mime){
  if(DLNS===undefined){ try{ DLNS=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null; }catch(e){ DLNS=null; } }
  if(DLNS){ try{ const r=await DLNS.save({filename:filename,data:data});
      toast(r&&r.status==="delivered"?"送信しました："+filename:"保存しました："+filename); return; }
    catch(e){ const c=e&&e.code;
      if(c==="declined")return toast("保存をキャンセルしました");
      if(c==="rate_limited")return toast("保存ダイアログが開いています");
      if(c==="unavailable"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed") DLNS=null;
      else return toast("保存できませんでした（"+(c||"エラー")+"）"); } }
  try{ const blob=(data instanceof Blob)?data:new Blob([data],{type:mime||"application/octet-stream"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("保存しました："+filename); }
  catch(e){ toast("この環境ではファイル保存を利用できません"); }
}

document.addEventListener("keydown",e=>{
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!e.shiftKey){ e.preventDefault(); return doUndo(); }
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){ e.preventDefault(); return doRedo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); return ACT.save(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){ e.preventDefault(); $("#f-search").focus(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="p"){ e.preventDefault(); return openPrint(); }
  if(inField)return;
  if(e.key==="Delete"){ e.preventDefault(); return deleteSel(); }
  if(e.key==="Insert"){ e.preventDefault(); return newTask(false); }
  if(e.key==="F2"){ const id=U.sel[0]; if(id){ const td=document.querySelector('tr[data-tid="'+id+'"] td[data-col="name"]'); if(td){ e.preventDefault(); startEdit(td); } } return; }
  if(e.altKey&&e.key==="ArrowRight"){ e.preventDefault(); return indentSel(1); }
  if(e.altKey&&e.key==="ArrowLeft"){ e.preventDefault(); return indentSel(-1); }
  if(e.altKey&&e.key==="ArrowUp"){ e.preventDefault(); return moveSel(-1); }
  if(e.altKey&&e.key==="ArrowDown"){ e.preventDefault(); return moveSel(1); }
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){
    const list=ROWS.map(t=>t.id); if(!list.length)return;
    const i=list.indexOf(U.sel[U.sel.length-1]); const ni=clamp(i+(e.key==="ArrowDown"?1:-1),0,list.length-1);
    e.preventDefault(); U.sel=[list[ni]]; render();
    const tr=document.querySelector('tr[data-tid="'+list[ni]+'"]'); if(tr)tr.scrollIntoView({block:"nearest"});
  }
});

const CRCT=(function(){ const t=new Uint32Array(256);

function printRange(){
  const t0=todayD(), P=PR.preset, leaves=D.tasks.filter(t=>!t.isSummary&&!t.blank);
  const span=list=>{ if(!list.length)return null; let a=list[0]._s,b=list[0]._f;
    list.forEach(t=>{ if(dayDiff(t._s,a)>0)a=t._s; if(dayDiff(b,t._f)>0)b=t._f; }); return {a:addD(a,-2),b:addD(b,2)}; };
  let s,f,label="工程表",note="";
  if(P==="week"){ s=addD(t0,-((t0.getDay()+6)%7)); f=addD(s,6); label="週間工程表"; }
  else if(P==="look2"){ s=t0; f=addD(t0,13); label="2週間先行工程表"; }
  else if(P==="look4"){ s=t0; f=addD(t0,27); label="4週間先行工程表"; }
  else if(P==="month"){ s=new Date(t0.getFullYear(),t0.getMonth(),1); f=new Date(t0.getFullYear(),t0.getMonth()+1,0); label="月間工程表"; }
  else if(P==="nextms"){ const ms=leaves.filter(t=>t.ms&&dayDiff(t0,t._f)>=0).sort((a,b)=>a._f-b._f)[0];
    s=t0; f=ms?addD(ms._f,1):SCH.pf; label="マイルストーンまでの工程"; note=ms?"目標：#"+ms.id+" "+ms.name+"（"+jdate(ms._f)+"）":"未到達のマイルストーンなし"; }
  else if(P==="wip"){ const r=span(leaves.filter(t=>(t.pct||0)<100)); s=r?r.a:SCH.ps; f=r?r.b:SCH.pf; label="残工程表"; note="未完了タスクのみを抽出"; }
  else if(P==="crit"){ const r=span(leaves.filter(t=>t.critical)); s=r?r.a:SCH.ps; f=r?r.b:SCH.pf; label="クリティカルパス工程表"; note="余裕 0 日以下のタスクのみを抽出"; }
  else if(P==="late"){ const l=leaves.filter(t=>(t.pct||0)<100&&LT(t._f,HM()?new Date():t0)); const r=span(l);
    s=r?r.a:SCH.ps; f=r?r.b:t0; label="遅延タスク工程表"; note=l.length?l.length+" 件の遅延を抽出":"遅延タスクはありません"; }
  else if(P==="sel"){ const ids=new Set(); U.sel.forEach(id=>{ const i=idx(id); if(i<0)return; ids.add(id); descendants(i).forEach(k=>ids.add(k.id)); });
    const r=span(D.tasks.filter(t=>ids.has(t.id)&&!t.isSummary&&!t.blank)); s=r?r.a:SCH.ps; f=r?r.b:SCH.pf; label="抜粋工程表"; note="選択した "+ids.size+" 件を抽出"; }
  else if(P==="custom"){ s=PR.from?pd(PR.from):SCH.ps; f=PR.to?pd(PR.to):SCH.pf; label="工程表"; }
  else { s=SCH.ps; f=SCH.pf; label="全体工程表"; }
  if(dayDiff(s,f)<0) f=addD(s,6);
  return {s:s,f:f,label:label,note:note};
}
function printRows(rg){
  const P=PR.preset, t0=todayD(), keep=new Set();
  const selIds=new Set(); if(P==="sel") U.sel.forEach(id=>{ const i=idx(id); if(i<0)return; selIds.add(id); descendants(i).forEach(k=>selIds.add(k.id)); });
  D.tasks.forEach(t=>{ if(t.isSummary||t.blank)return;
    let ok=dayDiff(d0(t._s),rg.f)>=0&&dayDiff(rg.s,d0(t._f))>=0;
    if(P==="crit") ok=ok&&t.critical;
    else if(P==="late") ok=ok&&(t.pct||0)<100&&LT(t._f,HM()?new Date():t0);
    else if(P==="wip") ok=ok&&(t.pct||0)<100;
    else if(P==="sel") ok=selIds.has(t.id);
    if(ok)keep.add(t.id); });
  D.tasks.forEach((t,i)=>{ if(!keep.has(t.id)||t.blank)return; let lv=t.level;
    for(let j=i-1;j>=0;j--){ if(!D.tasks[j].blank&&D.tasks[j].level<lv){ keep.add(D.tasks[j].id); lv=D.tasks[j].level; if(!lv)break; } } });
  /* 空白行は位置をそのままに、末尾のものも含めてすべて紙面へ出す
     （抽出結果が 0 件のときは「該当なし」を出したいので付けない） */
  if(keep.size) D.tasks.forEach(t=>{ if(t.blank) keep.add(t.id); });
  return D.tasks.filter(t=>keep.has(t.id));
}
function pScale(dayMM){ if(PR.scale!=="auto")return PR.scale;
  return dayMM>=3.2?"day":(dayMM*7>=7?"week":"month"); }
function pTimeline(m){

    const S=m.slots; let maj="",min="",st=0;

    return out; };
  let maj,min;
  if(scale==="day"){
    maj=grp(d=>d.getFullYear()+"/"+d.getMonth(),d=>d.getFullYear()+"年 "+(d.getMonth()+1)+"月");
    min=dl.map((d,i)=>{ const k=ymd(d), c=isHoli(d)?"hd":(isWork(d)?"":"we");
      const lab=dayMM>=6?d.getDate()+'<b>'+WD[d.getDay()]+'</b>':(dayMM>=3?String(d.getDate()):"");
      return '<i class="'+c+'" style="left:'+(i*dayMM)+'mm;width:'+dayMM+'mm">'+lab+'</i>'; }).join("");
  } else if(scale==="week"){
    maj=grp(d=>d.getFullYear()+"/"+d.getMonth(),d=>d.getFullYear()+"年 "+(d.getMonth()+1)+"月");
    min=grp(d=>ymd(addD(d,-((d.getDay()+6)%7))),(d,n)=>n*dayMM>=7?md(addD(d,-((d.getDay()+6)%7))):"");
  } else {
    maj=grp(d=>d.getFullYear(),d=>d.getFullYear()+"年");
    min=grp(d=>d.getFullYear()+"/"+d.getMonth(),(d,n)=>n*dayMM>=6?(d.getMonth()+1)+"月":"");
  }
  return '<div class="p-tlh"><div class="maj">'+maj+'</div><div class="min">'+min+'</div></div>';
}
function pTrack(t,m){
  const rg=m.rg, days=m.days, dayMM=m.dayMM, scale=m.scale, chartW=m.chartW;
  let h="";
  if(t.blank)return h;
  if(m.slots){
    const S=m.slots;
    S.forEach((d,i)=>{ if(i===0||ymd(S[i-1])!==ymd(d)) h+='<div class="p-vl" style="left:'+(i*dayMM)+'mm"></div>'; });
    const now=new Date(); let ti=-1;
    for(let i=0;i<S.length;i++){ if(ymd(S[i])===ymd(now)&&S[i].getHours()===now.getHours()){ ti=i; break; } }
    if(ti>=0) h+='<div class="p-today" style="left:'+(ti*dayMM)+'mm"></div>';
    const hit=S.map(d=>d.getTime()<=t._f.getTime()&&t._s.getTime()<=d.getTime()+3599999);
    const first=hit.indexOf(true), last=hit.lastIndexOf(true);
    if(first<0) return h;
    const x=first*dayMM, w=Math.max(0.8,(last-first+1)*dayMM);
    const cut=(t._s.getTime()<S[0].getTime()?"border-left-style:dashed;border-left-width:0.5mm;":"")+
              (t._f.getTime()>S[S.length-1].getTime()?"border-right-style:dashed;border-right-width:0.5mm;":"");
    if(t.ms) h+='<div class="p-ms'+(t.critical?" crit":"")+'" style="left:'+(x+dayMM/2-1.2)+'mm"></div>';
    else if(t.isSummary) h+='<div class="p-sum" style="left:'+x+'mm;width:'+w+'mm"></div>';
    else h+='<div class="p-bar'+(t.critical?" crit":"")+((t.pct||0)>=100?" done":"")+'" style="left:'+x+'mm;width:'+w+'mm;'+cut+'">'+
      ((t.pct||0)>0?'<div class="pf" style="width:'+(t.pct||0)+'%"></div>':"")+'</div>';
    if(PR.label&&!t.isSummary){
      const rn=(t.res||[]).map(r=>(resById(r.id)||{}).init||"").filter(Boolean).join("・");
      const txt=(t.ms?hhmm(t._s):rn)+((t.pct||0)>0&&(t.pct||0)<100?" "+t.pct+"%":"");
      if(txt&&x+w+2+txt.length*1.9<chartW) h+='<div class="p-blab" style="left:'+(x+w+1.2)+'mm">'+esc(txt)+'</div>'; }
    return h;
  }
  if(PR.shade&&dayMM>=1.4){ for(let i=0;i<days;i++){ const d=addD(rg.s,i),k=ymd(d);
      if(isHoli(d)) h+='<div class="p-hd" style="left:'+(i*dayMM)+'mm;width:'+dayMM+'mm"></div>';
      else if(!isWork(d)) h+='<div class="p-nw" style="left:'+(i*dayMM)+'mm;width:'+dayMM+'mm"></div>'; } }
  for(let i=0;i<days;i++){ const d=addD(rg.s,i);
    if((scale==="day"&&d.getDay()===1)||(scale!=="day"&&d.getDate()===1)) h+='<div class="p-vl" style="left:'+(i*dayMM)+'mm"></div>'; }
  const ti=dayDiff(rg.s,todayD()); if(ti>=0&&ti<days) h+='<div class="p-today" style="left:'+(ti*dayMM)+'mm"></div>';
  const cs=dayDiff(rg.s,d0(t._s))>=0?d0(t._s):rg.s, cf=dayDiff(d0(t._f),rg.f)>=0?d0(t._f):rg.f;
  if(dayDiff(cs,cf)<0) return h;
  const x=dayDiff(rg.s,cs)*dayMM, w=Math.max(0.8,(dayDiff(cs,cf)+1)*dayMM);
  const cut=(dayDiff(rg.s,t._s)<0?"border-left-style:dashed;border-left-width:0.5mm;":"")+
            (dayDiff(t._f,rg.f)<0?"border-right-style:dashed;border-right-width:0.5mm;":"");
  if(PR.base&&D.baseline&&D.baseline[t.id]){ const b=D.baseline[t.id];
    const bs=d0(pdt(b.s)),bf=d0(pdt(b.f)), qs=dayDiff(rg.s,bs)>=0?bs:rg.s, qf=dayDiff(bf,rg.f)>=0?bf:rg.f;
    if(dayDiff(qs,qf)>=0) h+='<div class="p-base" style="left:'+(dayDiff(rg.s,qs)*dayMM)+'mm;width:'+((dayDiff(qs,qf)+1)*dayMM)+'mm"></div>'; }
  const scut=(dayDiff(rg.s,t._s)<0?"border-left:0.5mm dashed #fff;":"")+(dayDiff(t._f,rg.f)<0?"border-right:0.5mm dashed #fff;":"");
  if(t.isSummary) h+='<div class="p-sum" style="left:'+x+'mm;width:'+w+'mm;'+scut+'"></div>';
  else if(t.ms) h+='<div class="p-ms'+(t.critical?" crit":"")+'" style="left:'+(x+dayMM/2-1.2)+'mm"></div>';
  else h+='<div class="p-bar'+(t.critical?" crit":"")+((t.pct||0)>=100?" done":"")+'" style="left:'+x+'mm;width:'+w+'mm;'+cut+'">'+
       ((t.pct||0)>0?'<div class="pf" style="width:'+(t.pct||0)+'%"></div>':"")+'</div>';
  if(PR.label&&!t.isSummary){
    const rn=(t.res||[]).map(r=>(resById(r.id)||{}).init||"").filter(Boolean).join("・");
    const txt=(t.ms?md(t._s):rn)+((t.pct||0)>0&&(t.pct||0)<100?" "+t.pct+"%":"");
    if(txt&&x+w+2+txt.length*1.9<chartW) h+='<div class="p-blab" style="left:'+(x+w+1.2)+'mm">'+esc(txt)+'</div>'; }
  return h;
}
function pCell(t,c){

function printMeta(){
  const rg=printRange(), rows=printRows(rg), pg=PAPER[PR.paper], M=10;
  const cw=pg.w-M*2, ch=pg.h-M*2, cols=PCOLS[PR.cols];
  const leftW=cols.reduce((a,c)=>a+c.w,0), chartW=Math.max(30,cw-leftW);

  let slots=null,n=days;
  if(HM()){ slots=[]; let d=nextWorkI(atH(rg.s,HS()),1); const end=atH(rg.f,HE()-1).getTime(); let g=0;
    while(d.getTime()<=end&&g++<5000){ slots.push(new Date(d)); d=nextWorkI(new Date(d.getTime()+3600000),1); }
    n=slots.length||1; }
  const dayMM=chartW/n, scale=slots?"hour":pScale(dayMM);
  const headH=(PR.stats?34:22), rowH=5.4;
  const pages=Math.max(1,Math.ceil((rows.length*rowH+headH+(PR.legend?8:0))/ch))+(PR.report?1:0);
  return {rg:rg,rows:rows,pg:pg,cw:cw,ch:ch,cols:cols,leftW:leftW,chartW:chartW,days:days,n:n,slots:slots,dayMM:dayMM,scale:scale,pages:pages};
}
function buildPrint(){
  const m=printMeta(), rg=m.rg, s=projStats(), t0=todayD();
  const inRange=D.tasks.filter(t=>!t.isSummary&&!t.blank&&m.rows.indexOf(t)>=0);
  const wsum=inRange.reduce((a,t)=>a+Math.max(1,t.dur|0),0);
  const pctR=wsum?Math.round(inRange.reduce((a,t)=>a+Math.max(1,t.dur|0)*(t.pct||0),0)/wsum):0;
  const lateN=inRange.filter(t=>(t.pct||0)<100&&LT(t._f,HM()?new Date():t0)).length;
  const critN=inRange.filter(t=>t.critical).length;
  const head='<div class="p-head"><div><div class="p-title">'+esc(rg.label)+'</div>'+

    '<div class="p-meta">対象期間　'+jdate(rg.s)+' 〜 '+jdate(rg.f)+'（'+m.days+' 日／稼働 '+workDays(rg.s,rg.f)+' 日）<br>'+
    '基準日　'+jdate(t0)+'　／　作成者　'+esc(D.meta.manager||"—")+'<br>'+

    pstat("この範囲の進捗",pctR+"%")+pstat("抽出タスク",inRange.length+" 件")+
