<title>FP3級 合格トラッカー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --surface-2:#EFEADD;
    --ink:#20232B;
    --ink-soft:#5B5F6B;
    --line:#DED6C4;
    --primary:#173B5E;
    --primary-ink:#0E2439;
    --accent:#B8862E;
    --accent-soft:#EADFC4;
    --success:#3E7D57;
    --success-soft:#DEEBE1;
    --danger:#A2453A;
    --danger-soft:#F1DEDB;
    --shadow: 0 1px 2px rgba(23,59,94,0.06), 0 6px 18px rgba(23,59,94,0.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161F;
      --surface:#1A2029;
      --surface-2:#212836;
      --ink:#EDEEF2;
      --ink-soft:#9CA3B4;
      --line:#323B4C;
      --primary:#6E9BC7;
      --primary-ink:#D8E6F4;
      --accent:#D9AD5F;
      --accent-soft:#3A2F1C;
      --success:#7BC49A;
      --success-soft:#1D3226;
      --danger:#E08A7D;
      --danger-soft:#3A1F1C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161F;
    --surface:#1A2029;
    --surface-2:#212836;
    --ink:#EDEEF2;
    --ink-soft:#9CA3B4;
    --line:#323B4C;
    --primary:#6E9BC7;
    --primary-ink:#D8E6F4;
    --accent:#D9AD5F;
    --accent-soft:#3A2F1C;
    --success:#7BC49A;
    --success-soft:#1D3226;
    --danger:#E08A7D;
    --danger-soft:#3A1F1C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Shippori Mincho", "Hiragino Mincho ProN", serif; text-wrap:balance; margin:0;}
  .num{font-variant-numeric:tabular-nums;}

  .wrap{max-width:1040px; margin:0 auto; padding:28px 20px 80px;}

  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:22px 26px; background:var(--primary); color:#fff; border-radius:16px;
    box-shadow:var(--shadow); margin-bottom:22px; flex-wrap:wrap;
  }
  header.top .brand{display:flex; align-items:baseline; gap:10px;}
  header.top h1{font-size:1.5rem; color:#fff; letter-spacing:.02em;}
  header.top .tag{font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); opacity:.95;}
  header.top .exam-input{display:flex; align-items:center; gap:8px; font-size:.85rem; color:#EAF0F7;}
  header.top input[type="date"]{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.35); color:#fff;
    border-radius:8px; padding:6px 9px; font:inherit;
  }
  header.top input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);}

  .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:16px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:20px; box-shadow:var(--shadow);
  }
  .span-4{grid-column:span 4;} .span-5{grid-column:span 5;} .span-6{grid-column:span 6;}
  .span-7{grid-column:span 7;} .span-8{grid-column:span 8;} .span-12{grid-column:span 12;}
  @media (max-width:760px){ .span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12;} }

  .card h2{font-size:1.05rem; margin-bottom:14px; color:var(--primary-ink);}
  .eyebrow{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:4px; display:block;}

  .stat-row{display:flex; gap:18px; flex-wrap:wrap;}
  .stat{flex:1; min-width:110px;}
  .stat .v{font-family:"Shippori Mincho",serif; font-size:2rem; color:var(--primary-ink); line-height:1;}
  .stat .l{font-size:.78rem; color:var(--ink-soft); margin-top:4px;}

  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
    font-size:.74rem; font-weight:700;
  }
  .pill.ok{background:var(--success-soft); color:var(--success);}
  .pill.warn{background:var(--accent-soft); color:var(--accent);}
  .pill.bad{background:var(--danger-soft); color:var(--danger);}
  .pill.dot::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

  nav.chapters{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 10px;}
  nav.chapters button{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:9px 14px; border-radius:10px; font:inherit; font-size:.85rem; cursor:pointer;
    display:flex; align-items:center; gap:8px; transition:.15s ease;
  }
  nav.chapters button:hover{border-color:var(--primary);}
  nav.chapters button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  nav.chapters button .chip{
    width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    font-size:.68rem; font-weight:700; background:var(--surface-2); color:var(--ink-soft);
  }
  nav.chapters button.active .chip{background:rgba(255,255,255,0.25); color:#fff;}

  .bars{display:flex; flex-direction:column; gap:10px;}
  .bar-row{display:grid; grid-template-columns:150px 1fr 42px; align-items:center; gap:10px; font-size:.82rem;}
  .bar-track{height:9px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--primary), var(--accent));}
  .bar-row .pct{text-align:right; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .tabs{display:flex; gap:6px; margin-bottom:16px;}
  .tabs button{
    border:none; background:transparent; color:var(--ink-soft); font:inherit; font-size:.88rem;
    padding:8px 4px; cursor:pointer; border-bottom:2px solid transparent;
  }
  .tabs button.active{color:var(--primary-ink); border-color:var(--accent); font-weight:700;}

  .quiz-q{font-size:1.02rem; margin-bottom:14px; line-height:1.6;}
  .quiz-opts{display:flex; flex-direction:column; gap:8px;}
  .opt{
    text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:11px 14px; border-radius:10px; font:inherit; font-size:.92rem; cursor:pointer;
  }
  .opt:hover{border-color:var(--primary);}
  .opt.correct{background:var(--success-soft); border-color:var(--success); color:var(--success);}
  .opt.wrong{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .opt[disabled]{cursor:default;}
  .quiz-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:.85rem; color:var(--ink-soft);}
  .btn{
    border:none; background:var(--primary); color:#fff; padding:9px 16px; border-radius:9px;
    font:inherit; font-size:.86rem; font-weight:700; cursor:pointer;
  }
  .btn.ghost{background:transparent; color:var(--primary-ink); border:1px solid var(--line);}
  .btn:disabled{opacity:.4; cursor:default;}
  .explain{
    margin-top:12px; padding:10px 13px; background:var(--surface-2); border-radius:10px; font-size:.85rem;
    color:var(--ink-soft); border-left:3px solid var(--accent);
  }

  .flash-stage{perspective:1200px; height:210px; margin-bottom:16px;}
  .flash-card{
    position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;
    cursor:pointer;
  }
  .flash-card.flipped{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .flash-face.front{background:var(--surface); font-size:1.08rem; font-weight:700; color:var(--primary-ink);}
  .flash-face.back{background:var(--primary); color:#fff; transform:rotateY(180deg); font-size:.95rem; line-height:1.6;}
  .flash-nav{display:flex; justify-content:space-between; align-items:center; font-size:.82rem; color:var(--ink-soft);}
  .flash-actions{display:flex; gap:8px;}
  .flash-actions button{padding:8px 14px; border-radius:9px; font:inherit; font-size:.82rem; border:1px solid var(--line); background:var(--surface); cursor:pointer;}
  .flash-actions .know{border-color:var(--success); color:var(--success);}
  .flash-actions .dontknow{border-color:var(--danger); color:var(--danger);}

  svg.chart{width:100%; height:180px; overflow:visible;}
  .chart-empty{font-size:.85rem; color:var(--ink-soft); padding:30px 0; text-align:center;}

  .streak-grid{display:grid; grid-template-columns:repeat(14,1fr); gap:5px;}
  .streak-cell{aspect-ratio:1; border-radius:4px; background:var(--surface-2);}
  .streak-cell.done{background:var(--success);}
  .streak-cell.today{outline:2px solid var(--accent); outline-offset:1px;}

  .pace-note{font-size:.86rem; color:var(--ink-soft); line-height:1.7; margin-top:10px;}
  footer.credit{text-align:center; font-size:.75rem; color:var(--ink-soft); margin-top:30px;}
</style>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>FP3級 合格トラッカー</h1>
      <span class="tag">Study Dashboard</span>
    </div>
    <div class="exam-input">
      <span>試験日</span>
      <input type="date" id="examDate">
    </div>
  </header>

  <div class="grid">
    <div class="card span-4">
      <span class="eyebrow">総合理解度</span>
      <div class="stat-row">
        <div class="stat"><div class="v num" id="overallScore">—</div><div class="l">平均正答率</div></div>
        <div class="stat"><div class="v num" id="daysLeft">—</div><div class="l">試験まで（日）</div></div>
      </div>
    </div>
    <div class="card span-4">
      <span class="eyebrow">学習ログ</span>
      <div class="stat-row">
        <div class="stat"><div class="v num" id="streakCount">0</div><div class="l">連続学習日数</div></div>
        <div class="stat"><div class="v num" id="totalAttempts">0</div><div class="l">総クイズ回数</div></div>
      </div>
    </div>
    <div class="card span-4">
      <span class="eyebrow">合格予測</span>
      <div id="paceHeadline" style="font-size:1.02rem; font-weight:700; color:var(--primary-ink); line-height:1.5;">
        データを蓄積中…
      </div>
    </div>
  </div>

  <div class="grid" style="margin-top:16px;">
    <div class="card span-7">
      <h2>正答率の推移</h2>
      <div id="chartWrap"><div class="chart-empty">クイズを1回受けるとグラフが表示されます</div></div>
    </div>
    <div class="card span-5">
      <h2>分野別 理解度</h2>
      <div class="bars" id="chapterBars"></div>
    </div>
  </div>

  <div class="grid" style="margin-top:16px;">
    <div class="card span-12">
      <h2>学習ペース配分</h2>
      <p class="pace-note" id="paceDetail">試験日を設定すると、1日あたりの推奨学習量を計算します。一般的にFP3級は合計30〜40時間・3〜5週間の学習で合格圏内に到達するケースが多いです（個人差があります）。</p>
      <div class="streak-grid" id="streakGrid" style="margin-top:14px;"></div>
    </div>
  </div>

  <h2 style="margin:30px 0 4px; font-size:1.3rem;">分野別トレーニング</h2>
  <nav class="chapters" id="chapterNav"></nav>

  <div class="card span-12" style="margin-top:6px;">
    <div class="tabs">
      <button class="tab-btn active" data-mode="quiz">一問一答クイズ</button>
      <button class="tab-btn" data-mode="cards">暗記カード</button>
    </div>
    <div id="quizArea"></div>
    <div id="cardArea" style="display:none;"></div>
  </div>

  <footer class="credit">学習データはこの端末のブラウザにのみ保存されます</footer>
</div>

<script>
const DATA = [
  {
    "id": "lp",
    "name": "①ライフプランニング",
    "short": "生保/年金/係数",
    "quiz": [
      {
        "q": "公的医療保険で、義務教育就学後70歳未満の自己負担割合は？",
        "opts": [
          "1割",
          "2割",
          "3割",
          "4割"
        ],
        "a": 2,
        "exp": "70歳未満（義務教育就学後）は原則3割負担です。70〜74歳は原則2割、75歳以上は原則1割。"
      },
      {
        "q": "健康保険の傷病手当金が支給されるのは、休業何日目からか？",
        "opts": [
          "連続2日休業の3日目から",
          "連続3日休業の4日目から",
          "連続4日休業の5日目から",
          "休業初日から"
        ],
        "a": 1,
        "exp": "連続3日間の待期期間の後、4日目から支給されます。国民健康保険にはこの制度は原則ありません。"
      },
      {
        "q": "国民年金の第3号被保険者に該当するのは誰か？",
        "opts": [
          "自営業者",
          "会社員本人",
          "第2号被保険者に扶養される配偶者",
          "無職の学生"
        ],
        "a": 2,
        "exp": "第3号被保険者は、第2号被保険者（会社員・公務員）に扶養される20歳以上60歳未満の配偶者です。"
      },
      {
        "q": "老齢基礎年金の受給に必要な受給資格期間は？",
        "opts": [
          "5年以上",
          "10年以上",
          "20年以上",
          "25年以上"
        ],
        "a": 1,
        "exp": "保険料納付済期間と免除期間などを合算して10年以上あれば受給資格を得られます。"
      },
      {
        "q": "「毎年一定額を積み立てた場合の将来の合計額」を求める係数は？",
        "opts": [
          "現価係数",
          "減債基金係数",
          "年金終価係数",
          "資本回収係数"
        ],
        "a": 2,
        "exp": "年金終価係数は、毎年の積立額から将来の元利合計額を求める際に使います。"
      },
      {
        "q": "iDeCo（確定拠出年金）の掛金の税務上の扱いは？",
        "opts": [
          "全額が生命保険料控除の対象",
          "全額が小規模企業共済等掛金控除として所得控除される",
          "控除の対象にはならない",
          "半額のみ控除される"
        ],
        "a": 1,
        "exp": "iDeCoの掛金は全額が小規模企業共済等掛金控除として所得控除の対象になります。"
      },
      {
        "q": "介護保険の第2号被保険者の年齢範囲は？",
        "opts": [
          "20歳以上40歳未満",
          "40歳以上65歳未満",
          "65歳以上75歳未満",
          "75歳以上"
        ],
        "a": 1,
        "exp": "第2号被保険者は40歳以上65歳未満の医療保険加入者で、特定疾病の場合のみ給付対象。"
      },
      {
        "q": "老齢年金を60歳に繰上げ受給した場合の減額は、生涯続くか？",
        "opts": [
          "生涯続く",
          "65歳になれば元に戻る",
          "70歳で元に戻る",
          "繰上げでも減額されない"
        ],
        "a": 0,
        "exp": "繰上げ受給による減額率は一生涯変わりません。繰下げの増額も同様に一生涯続きます。"
      },
      {
        "q": "教育訓練給付金の対象となるのは誰か？",
        "opts": [
          "失業者のみ",
          "雇用保険の被保険者等が指定講座を受講・修了した場合",
          "65歳以上の年金受給者",
          "学生全般"
        ],
        "a": 1,
        "exp": "雇用保険の一般被保険者等が厚生労働大臣指定の教育訓練を受講・修了した場合に受講費用の一部が支給されます。"
      },
      {
        "q": "キャッシュフロー表で使う「変動率」の考え方として正しいのは？",
        "opts": [
          "前年の金額に(1+変動率)を掛けて将来の金額を求める",
          "変動率は一律0%として計算する",
          "変動率は税率のことである",
          "変動率は元本を減らす際に使う"
        ],
        "a": 0,
        "exp": "物価上昇率や昇給率などの変動率を(1+変動率)^経過年数の形で将来の金額に反映させます。"
      },
      {
        "q": "資本回収係数の使い道として正しいのは？",
        "opts": [
          "将来の目標額から毎年の積立額を求める",
          "一定の元本を複数年に分けて取り崩す場合の毎年の受取額（または借入金の毎年の返済額）を求める",
          "現在の金額から将来の金額を求める",
          "将来の年金原資から現在必要な元本を求める"
        ],
        "a": 1,
        "exp": "資本回収係数は、元本を一定期間で取り崩す際の毎年の受取額、あるいはローンの毎年の返済額を計算する際に使います。"
      },
      {
        "q": "国民年金の第1号被保険者が上乗せで利用できる制度はどれか？",
        "opts": [
          "厚生年金",
          "国民年金基金",
          "企業型DC",
          "加給年金"
        ],
        "a": 1,
        "exp": "第1号被保険者（自営業者等）は、国民年金基金やiDeCoで上乗せの年金を準備できます。厚生年金・企業型DCは会社員等が対象。"
      },
      {
        "q": "公的年金の遺族基礎年金を受給できる遺族の範囲として正しいのは？",
        "opts": [
          "生計を維持されていた配偶者（子の有無を問わない）",
          "子のある配偶者、または子",
          "兄弟姉妹全般",
          "すべての親族"
        ],
        "a": 1,
        "exp": "遺族基礎年金は「子のある配偶者」または「子」に支給されます。子のない配偶者は対象外です。"
      },
      {
        "q": "国民年金の付加保険料（月額）はいくらか？",
        "opts": [
          "100円",
          "200円",
          "400円",
          "1,000円"
        ],
        "a": 2,
        "exp": "付加保険料は月額400円で、第1号被保険者等が任意で上乗せ加入できます。将来「200円×付加保険料納付月数」が加算されます。"
      },
      {
        "q": "雇用保険の高年齢雇用継続給付の対象となるのは何歳からか？",
        "opts": [
          "55歳以上60歳未満",
          "60歳以上65歳未満",
          "65歳以上70歳未満",
          "70歳以上"
        ],
        "a": 1,
        "exp": "高年齢雇用継続給付は60歳以上65歳未満の被保険者で、60歳到達時と比べ賃金が一定以上低下した場合に支給されます。"
      },
      {
        "q": "公的介護保険の第1号被保険者の年齢は？",
        "opts": [
          "40歳以上65歳未満",
          "60歳以上",
          "65歳以上",
          "70歳以上"
        ],
        "a": 2,
        "exp": "第1号被保険者は65歳以上の者で、原因を問わず要介護・要支援認定を受ければ給付対象。第2号は40歳以上65歳未満で特定疾病のみ対象。"
      },
      {
        "q": "確定拠出年金（企業型DC）の特徴として正しいのは？",
        "opts": [
          "給付額があらかじめ確定している",
          "掛金を加入者自身が運用し将来の給付額が変動する",
          "国が運用を行う",
          "中途換金が随時自由にできる"
        ],
        "a": 1,
        "exp": "確定拠出年金は掛金が確定しており、加入者自身の運用結果によって将来の給付額が変動します。給付額が確定しているのは確定給付企業年金（DB）です。"

const $ = s => document.querySelector(s);
const els = {};
let state = {
  examDate: localStorage.getItem("fp3_examDate") || "",
  quizHistory: JSON.parse(localStorage.getItem("fp3_quizHistory") || "[]"),
  studyLog: JSON.parse(localStorage.getItem("fp3_studyLog") || "[]"),
  flashState: JSON.parse(localStorage.getItem("fp3_flashState") || "{}"),
  activeChapter: DATA[0].id,
  mode: "quiz"
};

function save(){
  localStorage.setItem("fp3_examDate", state.examDate);
  localStorage.setItem("fp3_quizHistory", JSON.stringify(state.quizHistory));
  localStorage.setItem("fp3_studyLog", JSON.stringify(state.studyLog));
  localStorage.setItem("fp3_flashState", JSON.stringify(state.flashState));
}

function logToday(){
  const today = new Date().toISOString().slice(0,10);
  if(!state.studyLog.includes(today)){
    state.studyLog.push(today);
    save();
    renderDashboard();
  }
}

function chapterLatestScore(chId){
  const attempts = state.quizHistory.filter(h => h.chapter === chId);
  if(attempts.length === 0) return null;
  return attempts[attempts.length - 1].pct;
}

function overallAverage(){
  if(state.quizHistory.length === 0) return null;
  const sum = state.quizHistory.reduce((s,h)=>s+h.pct,0);
  return Math.round(sum / state.quizHistory.length);
}

function renderDashboard(){
  try{
    const examDateEl = $("#examDate");
    examDateEl.value = state.examDate;

    const avg = overallAverage();
    $("#overallScore").textContent = avg === null ? "—" : avg + "%";
    $("#totalAttempts").textContent = state.quizHistory.length;

    if(state.examDate){
      const d = Math.ceil((new Date(state.examDate) - new Date(new Date().toDateString())) / 86400000);
      $("#daysLeft").textContent = d >= 0 ? d : "終了";
    } else {
      $("#daysLeft").textContent = "—";
    }

    // streak
    const sorted = [...state.studyLog].sort();
    let streak = 0;
    let cursor = new Date();
    while(true){
      const key = cursor.toISOString().slice(0,10);
      if(state.studyLog.includes(key)){ streak++; cursor.setDate(cursor.getDate()-1); }
      else break;
    }
    $("#streakCount").textContent = streak;

    // streak grid (last 14 days)
    const grid = $("#streakGrid");
    grid.innerHTML = "";
    for(let i=13;i>=0;i--){
      const dt = new Date();
      dt.setDate(dt.getDate()-i);
      const key = dt.toISOString().slice(0,10);
      const cell = document.createElement("div");
      cell.className = "streak-cell" + (state.studyLog.includes(key) ? " done" : "") + (i===0 ? " today" : "");
      cell.title = key;
      grid.appendChild(cell);
    }

    // chapter bars
    const barsEl = $("#chapterBars");
    barsEl.innerHTML = "";
    DATA.forEach(ch=>{
      const pct = chapterLatestScore(ch.id);
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `<span>${ch.short}</span><div class="bar-track"><div class="bar-fill" style="width:${pct||0}%"></div></div><span class="pct num">${pct===null?"未受験":pct+"%"}</span>`;
      barsEl.appendChild(row);
    });

    renderChart();
    renderPace();
  }catch(e){ console.error(e); }
}

function renderChart(){
  const wrap = $("#chartWrap");
  if(state.quizHistory.length < 1){
    wrap.innerHTML = '<div class="chart-empty">クイズを1回受けるとグラフが表示されます</div>';
    return;
  }
  const w = 560, h = 170, pad = 28;
  const pts = state.quizHistory.map((h,i)=>({x:i, y:h.pct}));
  const n = pts.length;
  const xScale = i => n<=1 ? w/2 : pad + i*(w-2*pad)/(n-1);
  const yScale = v => h - pad - (v/100)*(h-2*pad);
  const linePath = pts.map((p,i)=> (i===0?"M":"L") + xScale(p.x).toFixed(1) + "," + yScale(p.y).toFixed(1)).join(" ");
  const areaPath = linePath + ` L${xScale(n-1).toFixed(1)},${h-pad} L${xScale(0).toFixed(1)},${h-pad} Z`;

  let gridLines = "";
  [0,25,50,75,100].forEach(v=>{
    const y = yScale(v).toFixed(1);
    gridLines += `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    gridLines += `<text x="4" y="${Number(y)+3}" font-size="9" fill="var(--ink-soft)">${v}</text>`;
  });

  const last = pts[pts.length-1];
  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${areaPath}" fill="var(--accent)" opacity="0.12"/>
    <path d="${linePath}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${xScale(p.x)}" cy="${yScale(p.y)}" r="3" fill="var(--primary)"/>`).join("")}
    <circle cx="${xScale(last.x)}" cy="${yScale(last.y)}" r="5" fill="var(--accent)"/>
  </svg>`;
}

function renderPace(){
  const headline = $("#paceHeadline");
  const detail = $("#paceDetail");
  const attempts = state.quizHistory;
  const untested = DATA.filter(ch => chapterLatestScore(ch.id) === null).length;

  let examInfo = "";
  if(state.examDate){
    const days = Math.ceil((new Date(state.examDate) - new Date(new Date().toDateString())) / 86400000);
    if(days >= 0){
      examInfo = `試験まで残り<strong class="num">${days}</strong>日。`;
      if(untested > 0){
        const perDay = Math.max(1, Math.ceil(untested / Math.max(1, Math.floor(days/2))));
        examInfo += ` 未着手の分野が${untested}個あります。復習期間を確保するなら、1日あたり分野${perDay}個ペースで一巡させるのがおすすめです。`;
      } else {
        examInfo += " 全分野に着手済みです。理解度が低い分野を優先して復習しましょう。";
      }
    } else {
      examInfo = "試験日を過ぎています。日付を更新してください。";
    }
  }

  if(attempts.length < 3){
    headline.textContent = untested>0 ? `まず${DATA[0].short}から一問一答を始めましょう` : "データを蓄積中…";
    detail.innerHTML = (examInfo ? examInfo + "<br>" : "") + "クイズを3回以上受けると、あなたの伸び方から合格ライン（正答率80%目安）到達時期を予測します。";
    return;
  }

  // linear regression of pct over attempt index, project to 80%
  const xs = attempts.map((_,i)=>i);
  const ys = attempts.map(h=>h.pct);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((a,x,i)=>a+x*ys[i],0);
  const sumXX = xs.reduce((a,x)=>a+x*x,0);
  const slope = (n*sumXY - sumX*sumY) / (n*sumXX - sumX*sumX || 1);
  const intercept = (sumY - slope*sumX) / n;
  const current = slope*(n-1) + intercept;

  if(slope <= 0.05){
    headline.textContent = "伸びが停滞ぎみです";
    detail.innerHTML = (examInfo?examInfo+"<br>":"") + "同じ分野の復習よりも、理解度が低い分野のクイズ・暗記カードを優先すると伸びやすくなります。";
    return;
  }
  const attemptsNeeded = (80 - current) / slope;
  if(attemptsNeeded <= 0){
    headline.innerHTML = `合格ライン（80%）に到達しています <span class="pill ok dot">順調</span>`;
    detail.innerHTML = (examInfo?examInfo+"<br>":"") + "この調子で本番まで定期的に復習を続けましょう。";
    return;
  }
  // assume roughly one attempt per study session; estimate sessions per day from log frequency
  const daysActive = new Set(state.studyLog).size || 1;
  const firstDate = attempts[0].date ? new Date(attempts[0].date) : new Date();
  const spanDays = Math.max(1, Math.round((new Date() - firstDate) / 86400000));
  const attemptsPerDay = attempts.length / spanDays;
  const daysNeeded = attemptsPerDay > 0 ? Math.ceil(attemptsNeeded / attemptsPerDay) : Math.ceil(attemptsNeeded);

  headline.innerHTML = `このペースなら約<strong class="num">${daysNeeded}</strong>日で合格ライン到達`;
  detail.innerHTML = (examInfo?examInfo+"<br>":"") +
    `現在の平均正答率は${Math.round(current)}%、1回のクイズで平均${slope.toFixed(1)}ポイントずつ伸びています。このペースを維持すると、あと${Math.ceil(attemptsNeeded)}回のクイズ（約${daysNeeded}日）で目安の80%に到達する見込みです。`;
}

function renderChapterNav(){
  const nav = $("#chapterNav");
  nav.innerHTML = "";
  DATA.forEach(ch=>{
    const pct = chapterLatestScore(ch.id);
    const btn = document.createElement("button");
    btn.className = "chap-btn" + (ch.id === state.activeChapter ? " active" : "");
    btn.innerHTML = `${ch.name} <span class="chip">${pct===null?"–":pct+"%"}</span>`;
    btn.onclick = () => { state.activeChapter = ch.id; renderChapterNav(); renderMode(); };
    nav.appendChild(btn);
  });
}

let quizSession = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const QUIZ_SET_SIZE = 10;

function buildShuffledQuiz(rawQuiz){
  const order = shuffle(rawQuiz.map((q,idx)=>idx)).slice(0, QUIZ_SET_SIZE);
  return order.map(idx=>{
    const q = rawQuiz[idx];
    const optOrder = shuffle(q.opts.map((o,i)=>i));
    const opts = optOrder.map(i=>q.opts[i]);
    const a = optOrder.indexOf(q.a);
    return { q:q.q, opts, a, exp:q.exp, srcIdx:idx };
  });
}

function startQuiz(ch, questions){
  const qs = questions || buildShuffledQuiz(ch.quiz);
  quizSession = { i:0, correct:0, total:qs.length, answered:false, questions:qs, wrong:[] };
  renderQuizQuestion(ch);
}

function renderQuizQuestion(ch){
  const area = $("#quizArea");
  if(quizSession.i >= quizSession.total){
    const pct = Math.round((quizSession.correct/quizSession.total)*100);
    state.quizHistory.push({chapter:ch.id, date:new Date().toISOString(), pct, correct:quizSession.correct, total:quizSession.total});
    logToday();
    save();
    renderDashboard();
    renderChapterNav();
    const wrongCount = quizSession.wrong.length;
    area.innerHTML = `
      <div style="text-align:center; padding:26px 0;">
        <div class="eyebrow">結果</div>
        <div style="font-family:'Shippori Mincho',serif; font-size:2.4rem; color:var(--primary-ink);">${pct}%</div>
        <div style="color:var(--ink-soft); margin:6px 0 18px;">${quizSession.correct} / ${quizSession.total} 問正解</div>
        <button class="btn" id="retryBtn">もう一度挑戦（シャッフル）</button>
        ${wrongCount>0?`<button class="btn ghost" id="reviewBtn" style="margin-left:8px;">間違えた${wrongCount}問だけ復習</button>`:""}
      </div>`;
    $("#retryBtn").onclick = () => startQuiz(ch);
    if(wrongCount>0){
      $("#reviewBtn").onclick = () => {
        const wrongRaw = quizSession.wrong.map(w=>ch.quiz[w]);
        startQuiz(ch, buildShuffledQuiz(wrongRaw));
      };
    }
    return;
  }
  const q = quizSession.questions[quizSession.i];
  area.innerHTML = `
    <div class="eyebrow">${ch.name} · 第${quizSession.i+1}問 / ${quizSession.total}</div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">${q.opts.map((o,idx)=>`<button class="opt" data-idx="${idx}">${o}</button>`).join("")}</div>
    <div id="explainWrap"></div>
    <div class="quiz-foot">
      <span>スコア: <strong class="num">${quizSession.correct}</strong> / ${quizSession.i}</span>
      <button class="btn ghost" id="nextBtn" disabled>次へ</button>
    </div>`;
  area.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = () => {
      if(quizSession.answered) return;
      quizSession.answered = true;
      const idx = Number(btn.dataset.idx);
      area.querySelectorAll(".opt").forEach((b,i)=>{
        b.disabled = true;
        if(i === q.a) b.classList.add("correct");
        else if(i === idx) b.classList.add("wrong");
      });
      if(idx === q.a) quizSession.correct++;
      else if(q.srcIdx !== undefined) quizSession.wrong.push(q.srcIdx);
      $("#explainWrap").innerHTML = `<div class="explain">${q.exp}</div>`;
      $("#nextBtn").disabled = false;
    };
  });
  $("#nextBtn").onclick = () => { quizSession.i++; quizSession.answered=false; renderQuizQuestion(ch); };
}

let cardSession = null;

function startCards(ch){
  cardSession = { i:0, flipped:false };
  renderCard(ch);
}

function renderCard(ch){
  const area = $("#cardArea");
  if(cardSession.i >= ch.cards.length){
    area.innerHTML = `<div style="text-align:center; padding:26px 0;">
      <div class="eyebrow">全カード完了</div>
      <button class="btn" id="cardRestart">最初から</button>
    </div>`;
    $("#cardRestart").onclick = () => startCards(ch);
    return;
  }
  const c = ch.cards[cardSession.i];
  area.innerHTML = `
    <div class="eyebrow">${ch.name} · カード ${cardSession.i+1} / ${ch.cards.length}</div>
    <div class="flash-stage">
      <div class="flash-card" id="flashCard">
        <div class="flash-face front">${c.f}</div>
        <div class="flash-face back">${c.b}</div>
      </div>
    </div>
    <div class="flash-nav">
      <span>タップして裏面を表示</span>
      <div class="flash-actions">
        <button class="dontknow" id="dkBtn">まだ不安</button>
        <button class="know" id="okBtn">覚えた</button>
      </div>
    </div>`;
  const cardEl = $("#flashCard");
  cardEl.onclick = () => cardEl.classList.toggle("flipped");
  const advance = (known) => {
    const key = ch.id + "_" + cardSession.i;
    state.flashState[key] = known;
    save();
    cardSession.i++;
    renderCard(ch);
  };
  $("#okBtn").onclick = (e) => { e.stopPropagation(); advance(true); };
  $("#dkBtn").onclick = (e) => { e.stopPropagation(); advance(false); };
}

function renderMode(){
  const ch = DATA.find(c=>c.id===state.activeChapter);
  $("#quizArea").style.display = state.mode === "quiz" ? "block" : "none";
  $("#cardArea").style.display = state.mode === "cards" ? "block" : "none";
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.mode===state.mode));
  if(state.mode === "quiz") startQuiz(ch);
  else startCards(ch);
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.onclick = () => { state.mode = btn.dataset.mode; renderMode(); };
});

$("#examDate").addEventListener("change", (e) => {
  state.examDate = e.target.value;
  save();
  renderDashboard();
});

renderDashboard();
renderChapterNav();
renderMode();
</script>
